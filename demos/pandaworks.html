<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pandaworks</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#efe9dd; --panel:#ffffff; --ink:#1f2a24; --muted:#727a70; --faint:#9aa196;
    --line:#e4dfd2; --line2:#ece7db;
    --green:#2f6b4a; --green-d:#255a3d; --forest:#1e3a2c; --forest2:#264a38;
    --gold:#d69a3f; --red:#c8483d; --red-bg:#fbecea; --amber:#d99a26; --amber-bg:#fbf3e2;
    --ok:#3f9e64; --ok-bg:#e9f4ec;
    --chip:#f4f0e6;
    --radius:14px; --shadow:0 1px 2px rgba(30,40,30,.05),0 6px 20px rgba(30,40,30,.05);
    font-synthesis:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em}
  h1,h2,h3{margin:0}
  button{font-family:inherit;cursor:pointer}
  a{color:var(--green)}

  header.top{background:var(--forest);color:#f3efe5;padding:16px 0 0}
  .wrap{max-width:none;margin:0 auto;padding:0 28px}
  .brand{display:flex;align-items:center;gap:14px}
  .brand .logo{width:44px;height:44px;border-radius:50%;background:#f3efe5;display:flex;align-items:center;justify-content:center;font-size:22px}
  .brand h1{font-size:23px;font-weight:800;letter-spacing:-.01em}
  .brand .sub{font-size:13px;color:#b9c6ba;margin-top:1px}
  nav.tabs{display:flex;gap:4px;margin-top:14px}
  nav.tabs button{
    background:transparent;border:none;color:#cdd8cd;padding:11px 18px;font-size:14.5px;font-weight:600;
    border-radius:10px 10px 0 0;position:relative;top:1px
  }
  nav.tabs button:hover{color:#fff}
  nav.tabs button.active{background:var(--bg);color:var(--ink)}

  main{padding:26px 0 80px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:22px 24px}
  .section-title{font-size:20px;font-weight:800;letter-spacing:-.01em}
  .muted{color:var(--muted)}
  .row{display:flex;align-items:center}
  .spacer{flex:1}

  table.grid-tbl{width:100%;border-collapse:collapse}
  table.grid-tbl th{
    text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
    font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line)
  }
  table.grid-tbl td{padding:14px;border-bottom:1px solid var(--line2);vertical-align:middle}
  table.grid-tbl tr:last-child td{border-bottom:none}
  .btn-panda{
    display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #cfd6cc;
    padding:8px 14px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--ink)
  }
  .btn-panda:hover{border-color:var(--green);background:#f6faf6}
  .btn-panda.sel{background:#dfeee2;border-color:var(--green)}

  .btn{border:1px solid #cfd6cc;background:#fff;border-radius:10px;padding:9px 15px;font-weight:600;font-size:14px;color:var(--ink)}
  .btn:hover{background:#f6f3ea}
  .btn-primary{background:var(--green);border-color:var(--green);color:#fff}
  .btn-primary:hover{background:var(--green-d)}
  .btn-primary:disabled{background:#a9c4b4;border-color:#a9c4b4;cursor:not-allowed}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--green)}
  .btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}

  input.inp,select.inp{
    border:1px solid #d6d0c2;background:#fff;border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);font-family:inherit
  }
  input.inp:focus,select.inp:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(47,107,74,.12)}
  textarea.inp{border:1px solid #d6d0c2;background:#fff;border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;width:100%;min-height:72px;resize:vertical}

  .wo-banner{background:var(--forest);color:#eef3ec;border-radius:var(--radius);padding:16px 22px;display:flex;gap:34px;flex-wrap:wrap;align-items:center}
  .wo-banner .lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#9fb4a3;font-weight:700;margin-bottom:3px}
  .wo-banner .val{font-size:15px;font-weight:700}
  .wo-banner .serial{font-size:19px;font-weight:800}
  .wo-banner .model{color:var(--gold);font-weight:800}
  .wo-banner .cust-sub{font-size:12.5px;color:#b7c6ba;font-weight:500;margin-top:2px}

  .grid-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .legend{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--muted)}
  .legend .dot{margin-right:5px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;background:#ccc}
  .dot.ok{background:var(--ok)} .dot.low{background:var(--amber)} .dot.out{background:var(--red)}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 16px}
  .chips button{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:#4c5750;display:inline-flex;align-items:center;gap:7px}
  .chips button:hover{background:#fff;border-color:var(--green);color:var(--green)}
  .chips button.on{background:var(--forest);border-color:var(--forest);color:#fff}
  .chips button .nsel{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--ok);color:#fff;font-size:11px;font-weight:800}
  .chips button.on .nsel{background:#7fd6a2;color:#12281c}

  .parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .ptile{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;text-align:left;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;min-height:48px}
  .ptile:hover{border-color:var(--green);background:#f8fbf8}
  .ptile.done{background:#f3f9f4;border-color:#bcd7c6}
  .ptile .stock{display:flex;align-items:center;gap:5px;flex:0 0 auto;font-size:12px;color:var(--muted)}
  .ptile .stock .n{font-variant-numeric:tabular-nums;font-weight:600;color:#5b635a}
  .ptile .pname{flex:1;font-weight:600;min-width:0}
  .ptile .sel-pill{flex:0 0 auto;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px}
  .ptile .sel-pill.Adjust{background:#e7f0ea;color:var(--green-d)}
  .ptile .sel-pill.Replace{background:var(--green);color:#fff}
  .ptile .sel-pill.Warranty{background:var(--gold);color:#3d2c07}
  .ptile .pname .pn{display:block;font-size:11.5px;font-weight:600;color:var(--green);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .ptile .pname .pn.none{color:var(--faint);font-weight:500;font-family:inherit}
  .wo-banner .bom-sel{background:#2c5540;border-color:#37624a;color:#fff;padding:6px 10px;font-size:13.5px;font-weight:700;max-width:260px}
  .ptile .oosflag{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.05em;color:#fff;background:var(--red);padding:1px 6px;border-radius:999px;vertical-align:middle}

  .pop{position:absolute;z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(20,30,22,.18);padding:8px;display:flex;gap:6px;align-items:center}
  .pop button{border:1px solid #d3d8ce;background:#fff;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:700;color:#5a625a}
  .pop button:hover{border-color:var(--green);color:var(--green)}
  .pop button.on[data-a="Adjust"]{background:#e7f0ea;border-color:var(--green);color:var(--green-d)}
  .pop button.on[data-a="Replace"]{background:var(--green);border-color:var(--green);color:#fff}
  .pop button.on[data-a="Warranty"]{background:var(--gold);border-color:var(--gold);color:#3d2c07}
  .pop button.btn-primary{background:var(--fz-blue)!important;border-color:var(--fz-blue)!important;color:#fff!important}
  .pop button.btn-primary:hover{background:#2A4365!important;border-color:#2A4365!important;color:#fff!important}
  .pop .pop-x{border-color:transparent;color:#b9473d;font-weight:800}
  .pop .pop-x:hover{background:#faeae8;border-color:transparent;color:#b9473d}

  .oos-banner{display:flex;gap:11px;align-items:flex-start;background:var(--red-bg);border:1px solid #eec4bf;color:#8a2f26;border-radius:11px;padding:12px 15px;margin-bottom:16px;font-size:13.5px}
  .oos-banner b{color:#7a281f}
  table.wo-tbl{width:100%;border-collapse:collapse}
  table.wo-tbl th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
  table.wo-tbl td{padding:11px 10px;border-bottom:1px solid var(--line2);font-size:14px}
  table.wo-tbl tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
  .pill.Adjust{background:#e7f0ea;color:var(--green-d)}
  .pill.Replace{background:#dcebe1;color:var(--green-d);border:1px solid #bcd7c6}
  .pill.Warranty{background:#f7 ecd4;background:#faf0d8;color:#8a6a1e}
  .pill.oos{background:var(--red);color:#fff;margin-left:8px}
  .x-btn{border:none;background:transparent;color:#b9473d;font-size:16px;font-weight:700;padding:2px 6px;border-radius:6px}
  .x-btn:hover{background:#faeae8}
  .empty{color:var(--faint);font-size:14px;padding:16px 10px}

  .side{width:290px;flex:0 0 290px}
  .sumbox .srow{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
  .sumbox .srow .k{color:var(--muted)}
  .sumbox .srow .v{font-weight:700;font-variant-numeric:tabular-nums}
  .status-seg{display:flex;gap:6px;margin:6px 0 4px;flex-wrap:wrap}
  .status-seg button{flex:1;border:1px solid #d3d8ce;background:#fff;border-radius:9px;padding:8px 6px;font-size:12.5px;font-weight:700;color:#5a625a;min-width:78px}
  .status-seg button.on{background:var(--forest);border-color:var(--forest);color:#fff}
  .note-hint{font-size:12px;color:var(--faint);margin-top:12px;line-height:1.5}

  .status-badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700}
  .sb-checkin{background:#fbf3e2;color:#9a7414}
  .sb-progress{background:#fbf3e2;color:#9a7414}
  .sb-completed{background:#e9f4ec;color:#2c6a45}

  .wo-card{display:flex;align-items:center;gap:16px;padding:15px 18px;border-bottom:1px solid var(--line2);cursor:pointer}
  .wo-card:hover{background:#f8f5ee}
  .wo-card:last-child{border-bottom:none}
  .wo-card .id{font-weight:700}
  .wo-card .when{color:var(--faint);font-size:12.5px}

  .bom-tbl td{padding:8px 14px}
  .bom-tbl .bom-sys{font-weight:800;color:var(--green-d);vertical-align:top;padding-top:12px;background:#fbf9f4;border-right:1px solid var(--line2)}
  .bom-cell{width:100%;min-width:260px;font-size:13px;padding:7px 10px;border-color:transparent;background:transparent}
  .bom-cell:hover{border-color:var(--line);background:#fff}
  .bom-cell:focus{border-color:var(--green);background:#fff}
  .bom-cell.ph{color:var(--faint);font-family:inherit;font-style:italic}
  .bom-cell.edited{background:#fdf6e6;border-color:#eed9ad}
  tr.bom-hit{cursor:pointer} tr.bom-hit:hover td{background:#f8fbf8}
  
  .inv-badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
  .inv-badge.ok{background:var(--ok-bg);color:#2c6a45}
  .inv-badge.low{background:var(--amber-bg);color:#8a6a1e}
  .inv-badge.out{background:var(--red-bg);color:#9a352b}
  .stepper{display:inline-flex;align-items:center;gap:2px}
  .stepper button{width:30px;height:30px;border:1px solid #d3d8ce;background:#fff;border-radius:8px;font-size:16px;font-weight:700;color:#4c5750;display:flex;align-items:center;justify-content:center}
  .stepper button:hover{border-color:var(--green);color:var(--green)}
  .stepper .n{width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

  .inv-page{max-width:820px;margin:0 auto}
  .invoice{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:38px 42px;box-shadow:var(--shadow)}
  .inv-hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--forest);padding-bottom:18px;margin-bottom:22px}
  .inv-hd .co{display:flex;align-items:center;gap:12px}
  .inv-hd .co .logo{width:40px;height:40px;border-radius:50%;background:var(--forest);display:flex;align-items:center;justify-content:center;font-size:20px}
  .inv-hd .co h2{font-size:20px;font-weight:800}
  .inv-meta{text-align:right;font-size:13px;color:var(--muted)}
  .inv-meta .num{font-size:18px;font-weight:800;color:var(--ink)}
  .bill{display:flex;justify-content:space-between;gap:24px;margin-bottom:22px;font-size:13.5px}
  .bill .lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:5px}
  table.inv-tbl{width:100%;border-collapse:collapse;margin-bottom:8px}
  table.inv-tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:9px 8px;border-bottom:1.5px solid var(--line)}
  table.inv-tbl th.r,table.inv-tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
  table.inv-tbl td{padding:11px 8px;border-bottom:1px solid var(--line2);font-size:13.5px}
  .inv-tot{margin-left:auto;width:280px;margin-top:12px}
  .inv-tot .srow{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
  .inv-tot .srow.grand{border-top:2px solid var(--forest);margin-top:6px;padding-top:12px;font-size:18px;font-weight:800}
  .inv-tot .srow .credit{color:var(--red)}
  .inv-foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

  .flex-gap{display:flex;gap:20px;align-items:flex-start}
  @media(max-width:840px){.flex-gap{flex-direction:column}.side{width:100%;flex:auto}}
  .hint-line{font-size:13px;color:var(--muted);margin:2px 0 0}

  .cal-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  table.cal-tbl{width:100%;border-collapse:collapse;table-layout:fixed;min-width:860px}
  .cal-tbl th.cal-day-hd{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  .cal-tbl th.cal-day-hd.today{color:var(--green)}
  .cal-tbl td{border:1px solid var(--line2);vertical-align:top;padding:7px;min-height:92px}
  .cal-tech{font-weight:800;font-size:13px;white-space:nowrap;background:#f7f4ec}
  .booking{display:block;width:100%;text-align:left;border:1px solid #d3d8ce;border-radius:8px;padding:5px 8px;font-size:12px;font-weight:600;margin-bottom:5px;background:#fff;color:var(--ink)}
  .booking:hover{border-color:var(--green)}
  .booking .t{font-size:10.5px;color:var(--muted);font-weight:700;margin-right:4px}
  .booking.s-prog{background:#fbf3e2;border-color:#e8d3a2}
  .booking.s-done{background:#e9f4ec;border-color:#bcdcc8}
  .cal-cap{font-size:10.5px;color:var(--faint);margin-top:2px}
  .cal-cap.full{color:var(--red);font-weight:700}

  .overlay{position:fixed;inset:0;background:rgba(20,28,22,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:22px 24px;width:430px;max-width:100%}
  .modal h3{font-size:17px;font-weight:800;margin-bottom:14px}
  .frow{margin-bottom:12px}
  .lbl2{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:4px}
  #toast{position:fixed;right:22px;bottom:22px;background:var(--forest);color:#eef3ec;padding:12px 18px;border-radius:11px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:.25s;z-index:80;pointer-events:none;max-width:360px}
  #toast.show{opacity:1;transform:none}
  #toast.err{background:var(--red)}

  .scanbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#f7f4ec;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .gear-qty{width:58px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;border:1px solid #d3d8ce;border-radius:8px;padding:6px 4px;font-family:inherit;font-size:14px}
  .gear-qty:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(47,107,74,.12)}
  video#camvid{width:100%;border-radius:10px;background:#000;max-height:300px}

  .ls-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .ls-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line2)}
  .ls-toolbar .inp{border-radius:6px;padding:8px 10px;font-size:13.5px}
  .btn-search{background:#4a7fb5;border:1px solid #40709f;color:#fff;border-radius:6px;padding:9px 16px;font-weight:700;font-size:13.5px}
  .btn-search:hover{background:#40709f}
  .btn-newwo{background:#5da432;border:1px solid #4e8c2a;color:#fff;border-radius:6px;padding:9px 14px;font-weight:700;font-size:13.5px}
  .btn-newwo:hover{background:#4e8c2a}
  .ls-filters{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line2);background:#fbfaf7}
  .ls-flbl{font-size:11px;font-weight:700;color:#5a625a;margin-bottom:4px}
  .ls-resbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
  .ls-page{border:1px solid #bcd0e5;border-radius:5px;padding:4px 11px;background:#eef4fb;color:#2b6cb0;font-weight:700;font-size:12.5px}
  .ls-per{color:#2b6cb0;font-weight:700;font-size:12.5px;letter-spacing:.03em}
  table.ls-tbl{width:100%;border-collapse:collapse}
  .ls-tbl th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  .ls-tbl td{padding:10px;border-bottom:1px solid var(--line2);font-size:13.5px;vertical-align:middle}
  .ls-tbl td.r,.ls-tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
  .ls-tbl tr.ls-row{cursor:pointer}
  .ls-tbl tr.ls-row:hover td{background:#f8f5ee}
  .ls-badge{display:inline-block;padding:3px 9px;border-radius:3px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
  .ls-link{font-weight:700}
  .ls-day{font-size:11.5px;font-weight:800;letter-spacing:.04em;color:#5a625a;padding:16px 10px 6px;border-bottom:1px solid var(--line);background:#fbfaf7;text-transform:uppercase}
  .ls-edit{width:28px;height:28px;border:1px solid #d3d8ce;background:#fff;border-radius:5px;font-size:13px;cursor:pointer}
  .ls-edit:hover{border-color:var(--green);color:var(--green)}
  .ovr-late{color:#9a352b;background:#fdeceb;padding:2px 7px;border-radius:3px;font-weight:700}
  .ovr-soon{background:#fbf3d9;padding:2px 7px;border-radius:3px;font-weight:700;color:#8a6a1e}

  .wd{position:fixed;inset:0;z-index:100;background:#f4f3f0;overflow:auto}
  .wd-top{height:4px;background:#c0392b}
  .wd-hd{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid #e8e6e1;padding:12px 26px;position:sticky;top:0;z-index:5}
  .wd-brand{font-weight:900;font-size:16px;color:#1c1b1a}
  .wd-brand .rp{color:#c0392b}

  .pg-panda:focus{outline:none}

  .pg-arm{transform-box:view-box;transform-origin:206px 146px;animation:pgScratch 2.6s ease-in-out infinite;transition:opacity .15s}
  @keyframes pgScratch{0%,45%,100%{transform:rotate(0)}52%{transform:rotate(-6deg)}59%{transform:rotate(2deg)}66%{transform:rotate(-6deg)}73%{transform:rotate(2deg)}80%{transform:rotate(0)}}
  .pg-cover{opacity:0;transform-box:view-box;transform-origin:150px 160px;transform:translateY(46px);transition:transform .28s cubic-bezier(.3,1.3,.5,1),opacity .15s}
  .pg-panda.cover .pg-cover{opacity:1;transform:none}

  .pg-edgepaw{transition:opacity .15s}
  .pg-panda.shake .pg-shake{animation:pgNo .6s ease-in-out}
  .pg-shake{transform-box:view-box;transform-origin:150px 158px}
  @keyframes pgNo{20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}

const BOM_GROUP_ALIAS = { "Head":"Steering" };
const BOM_PART_ALIAS = {
  "Kick Stand":"Kickstand", "Line":"Hose", "Pad":"Pads", "Set":"Brake: Set", "Grips":"Grips: Set", "Wheel":"Wheel: Set",
  "Pedal: Drive Side":"Pedal: Set", "Pedal: Non-Drive Side":"Pedal: Set",
  "Crank: Drive Side":"Crank: Driveside", "Crank: Non-Drive Side":"Crank: Non-Driveside",
  "Spoke: Drive Side":"Spoke: Driveside", "Spoke: Non-Drive Side":"Spoke: Non-Driveside",
  "Sensor: Pedal Assist":"PAS Sensor", "Sensor: Speed":"Speed sensor"
};
function bomRef(brand,model){ return brand+"|"+model; }
function bomSplit(ref){ const i=(ref||"").indexOf("|"); return i<0?{brand:ref||"",model:""}:{brand:ref.slice(0,i),model:ref.slice(i+1)}; }
function stEdits(){ try{ return (state&&state.bomEdits)||{}; }catch(e){ return {}; } }
function stModels(){ try{ return (state&&state.bomModels)||[]; }catch(e){ return []; } }
function bomBrands(){
  const s=[]; Object.keys(BOM_SEED).forEach(b=>s.push(b));
  stModels().forEach(m=>{ if(s.indexOf(m.brand)<0) s.push(m.brand); });
  return s;
}
function bomModelsOf(brand){
  const s=Object.keys(BOM_SEED[brand]||{}).slice();
  stModels().forEach(m=>{ if(m.brand===brand && s.indexOf(m.model)<0) s.push(m.model); });
  return s;
}
function bomAllModels(){ const out=[]; bomBrands().forEach(b=>bomModelsOf(b).forEach(m=>out.push({brand:b,model:m,ref:bomRef(b,m)}))); return out; }
function bomSeedVal(brand,model,g,p){ const b=BOM_SEED[brand]; const m=b&&b[model]; const gg=m&&m[g]; return (gg&&gg[p])||""; }
function bomVal(brand,model,g,p){
  const k=[brand,model,g,p].join("|");
  const ed=stEdits(); if(Object.prototype.hasOwnProperty.call(ed,k)) return ed[k];
  return bomSeedVal(brand,model,g,p);
}
function bomIsEdited(brand,model,g,p){ return Object.prototype.hasOwnProperty.call(stEdits(),[brand,model,g,p].join("|")); }
function bomSetVal(brand,model,g,p,val){
  if(!state.bomEdits) state.bomEdits={};
  const k=[brand,model,g,p].join("|"); val=(val||"").trim();
  if(val===bomSeedVal(brand,model,g,p)) delete state.bomEdits[k]; else state.bomEdits[k]=val;
  persist();
}
function bomIsPlaceholder(v){ return !v || /^(n\/?a|none|not listed|none listed|no (part number|model) listed.*|see .+|tbd|\?+)$/i.test(v.trim()); }
function bomLookup(ref,g,p){
  if(!ref) return null;
  const {brand,model}=bomSplit(ref);
  if(!bomModelsOf(brand).includes(model)) return null;
  const gg=BOM_GROUP_ALIAS[g]||g;
  const cands=[p, BOM_PART_ALIAS[p]].filter(Boolean);
  for(const pp of cands){ const v=bomVal(brand,model,gg,pp); if(v) return {value:v, group:gg, part:pp}; }
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
  const parts=BOM_PARTS[gg]||[];
  const hit=parts.find(x=>norm(x)===norm(p)||norm(x)===norm(p)+"s");
  if(hit){ const v=bomVal(brand,model,gg,hit); if(v) return {value:v, group:gg, part:hit}; }
  return null;
}
function bomPartNo(ref,g,p){ const r=bomLookup(ref,g,p); return r&&!bomIsPlaceholder(r.value)?r.value:""; }
function bomMatch(name){
  const n=(name||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  if(!n) return "";
  let best="", bestLen=0;
  bomAllModels().forEach(x=>{
    const b=x.brand.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
    const m=x.model.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
    const brandOk = n.includes(b);
    const modelOk = n.includes(m);
    if(modelOk && (brandOk || Object.keys(BOM_SEED).every(o=>!n.includes(o.toLowerCase())))){
      const score=m.length+(brandOk?100:0);
      if(score>bestLen){ best=x.ref; bestLen=score; }
    }
  });
  return best;
}
function bomCount(brand,model){
  let have=0,total=0; const c=catalogFor(bomRef(brand,model));
  Object.keys(c).forEach(g=>c[g].forEach(p=>{ total++; if(!bomIsPlaceholder(bomVal(brand,model,g,p))) have++; }));
  return {have,total};
}
function bomStampItems(d){ (d.items||[]).forEach(it=>{ it.partNo=bomPartNo(d.bomRef,it.category,it.part); }); }

function isNA(v){ return /^n\/?a\b/i.test(String(v||"").trim()); }
function modelLabel(ref){ const s=bomSplit(ref); return s.model ? (s.brand+" "+s.model) : (ref||""); }
function assetType(ref){ return SCOOTER_BRANDS.includes(bomSplit(ref).brand) ? "Scooter" : "E-bike"; }
function assetIcon(ref){ return assetType(ref)==="Scooter" ? "🛴" : "🚲"; }
function catalogFor(ref){
  const {brand,model}=bomSplit(ref); const out={};
  const src=BOM_BRAND_PARTS[brand]||BOM_PARTS;
  BOM_GROUPS.forEach(g=>{
    const ps=(src[g]||[]).filter(p=>!isNA(bomVal(brand,model,g,p)));
    if(ps.length) out[g]=ps;
  });
  return out;
}
function catalogCount(ref){ const c=catalogFor(ref); return Object.keys(c).reduce((n,g)=>n+c[g].length,0); }

function csvDownload(filename, rows){

  const url = URL.createObjectURL(blob);

  document.body.appendChild(a); a.click();

function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cell); cell=""; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=""; } else cell+=c; }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}
function mapForestRows(rows){
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=(...res)=>{ for(const re of res){ const i=h.findIndex(x=>re.test(x)); if(i>=0) return i; } return -1; };
  const m={serial:col(/serial/), variant:col(/variant/,/vehicle/,/model/,/product/), state:col(/asset.?state/,/state/,/status/), hub:col(/hub/,/location/,/service.?area/,/warehouse/),
    customer:col(/customer/,/assignment/,/subscriber/,/^name$/), email:col(/e-?mail/), fid:col(/^id$/,/asset.?id/)};
  const assets=rows.slice(1).map(r=>{ const g=k=>m[k]>=0?(r[m[k]]||"").trim():""; return {serial:g("serial"),variant:g("variant"),state:g("state"),hub:g("hub"),customer:g("customer"),email:g("email"),fid:g("fid")}; }).filter(a=>a.serial);
  return {map:m, headers:rows[0], assets};
}

function addSoToPo(so){
  if(!so||so.status!=="Needed") return;
  let po=(state.purchaseOrders||[]).find(p=>p.status==="Draft"&&p.vendor===so.vendor&&p.hub===so.hub);
  if(!po){ po=newPo(so.vendor,so.hub); }
  po.lines.push({partNo:so.partNo, desc:so.desc, qty:so.qty, cost:so.cost, received:0, soId:so.id, woId:so.woId, stockRef:""});
  so.poId=po.id; stamped(so,"On PO");
  return po;
}
function newPo(vendor,hub){

function receivePo(po){
  const arrived=new Set(), lsIn=[]; let n=0;
  document.querySelectorAll("[data-rcv]").forEach(inp=>{
    const l=po.lines[+inp.dataset.rcv], left=Math.max(0,(Number(l.qty)||0)-(Number(l.received)||0)), q=Math.min(left,Math.max(0,Math.round(Number(inp.value)||0)));
    if(!q) return; n+=q; l.received=(Number(l.received)||0)+q;
    if(l.stockRef) state.stock[l.stockRef]=(state.stock[l.stockRef]||0)+q;
    if(l.lsId&&po.hub) lsIn.push({id:l.lsId,hub:po.hub,delta:q});
    const so=l.soId&&soById(l.soId);
    if(so&&l.received>=l.qty){ stamped(so,"Received"); so.receivedAt=new Date().toISOString();
      const w=state.workOrders.find(x=>x.id===so.woId);
      if(w&&!isDone(w.status)){ w.partsArrived=true; w.updatedAt=new Date().toISOString(); w.internalNote=((w.internalNote||"")+"\nParts arrived: "+so.desc+" ("+po.id+")").trim(); arrived.add(w.id); } }
  });
  if(!n){ toast("Nothing to receive","err"); return; }
  lsAdjust(lsIn);
  const full=po.lines.every(l=>(Number(l.received)||0)>=(Number(l.qty)||0));
  stamped(po, full?"Received":"Partially received"); if(full) po.receivedAt=new Date().toISOString();
  toast("Received "+n+" item"+(n>1?"s":"")+(arrived.size?". Parts in for "+[...arrived].join(", "):""));
}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){} ta.remove(); return ok; }
}
function customerStatus(s){
  if(isDone(s)) return "all done";
  if(/Waiting|Long Term|Warranty/.test(s)) return "waiting on a part";
  if(/QC/.test(s)) return "getting its final check";
  if(/In Progress/.test(s)) return "on the stand being worked on";
  return "checked in and in line for service";
}
function ikeonoTemplates(c,w){

  } else T.push(["Hello",`Hi ${first}, this is Pandacare${hub}. `]);

function invoiceLink(w){

}

const B2B_DEFAULT={
  specialized:{name:"Specialized B2B", url:""},
  trek:{name:"Trek B2B", url:""},
  qbp:{name:"QBP", url:""},
  brompton:{name:"Brompton", url:""}
};
function b2bConf(v){ const s=(state&&state.settings&&state.settings.b2b)||{}; return Object.assign({},B2B_DEFAULT[v],s[v]||{}); }
function b2bFor(ref,value){
  const v=String(value||""), brand=bomSplit(ref).brand;
  let m=v.match(/QBP:\s*([A-Z]{2}\d{3,6})/i); if(m) return {vendor:"qbp",part:m[1]};
  if(brand==="Specialized"){ m=v.match(/\b(S\d{9}|\d{5}-\d{4})\b/); if(m) return {vendor:"specialized",part:m[1]}; }
  if(brand==="Trek"){ m=v.match(/\b(W?\d{5,7})\b/); if(m) return {vendor:"trek",part:m[1]}; }
  if(brand==="Brompton"){ m=v.match(/\b(Q\d{6})\b/); if(m) return {vendor:"brompton",part:m[1]}; }
  return null;
}
function pnLink(ref,value){
  const b=b2bFor(ref,value); if(!b) return "";
  const c=b2bConf(b.vendor);
  return `<button type="button" class="pn-link" data-b2b="${esc(b.vendor)}" data-part="${esc(b.part)}" title="Copy ${esc(b.part)} and open ${esc(c.name)}">${esc(b.part)} ${ico("ext",11)}<small>${esc(c.name.replace(/ B2B$/,""))}</small></button>`;
}

}

function refreshFleet(){ if(route.tab!=="pandacare"||route.draft||route.invoiceId) return; const v=document.getElementById("view"); v.innerHTML=viewPandacare(); wirePandacare(); }
function startWoForBike(b){
  const me=currentUser&&state.crew.includes(currentUser.name)?currentUser.name:"auto";
  route.draft={
    serial:b.serial, model:b.model, bomRef:b.model, displayModel:modelLabel(b.model), hub:b.hub||"",
    customer:b.customer?{...b.customer}:null, tech:me==="auto"?((state.crew||[])[0]||""):me, status:"Check In", items:[],
    receiptNote:"", internalNote:"", savedId:null, schedTech:me, schedDate:todayISO()
  };
  route.tab="pandacare"; route.invoiceId=null;
  render(); window.scrollTo(0,0);
}

function archiveWo(w,on){
  if(!can("workorders")){ toast("Your role can't change work orders","err"); return; }
  if(route.draft&&route.draft.dirty&&!confirm("Archive without saving your changes?")) return;
  w.archived=on?new Date().toISOString():undefined; if(!on) delete w.archived; else w.archivedBy=currentUser?currentUser.name:"";
  persist(); route.draft=null; toast(w.id+(on?" archived. Find it under Work Orders › Archived":" is back in the list"));
  route.orderFilters.tab=on?"active":route.orderFilters.tab; go("orders");
}
function deleteWo(w){
  if(!can("deletewo")){ toast("Your role can't delete work orders. Archive it instead","err"); return; }
  const used=w.inventoryApplied?" Parts already taken out of stock are not put back.":"";
  if(!confirm("Delete "+w.id+" for good? This can't be undone. Archive it instead if you might need it later."+used)) return;
  state.workOrders=state.workOrders.filter(x=>x.id!==w.id);
  (state.specialOrders||[]).forEach(so=>{ if(so.woId===w.id&&(so.status==="Needed")) so.status="Cancelled"; });
  try{ route.recent=(route.recent||[]).filter(id=>id!==w.id); localStorage.setItem("pw_recent",JSON.stringify(route.recent)); }catch(e){}
  persist(); route.draft=null; route.invoiceId=null; toast(w.id+" deleted"); go("orders");
}
function openWoInEditor(w){
  route.invoiceId=null; route.tab="pandacare"; noteRecent(w.id);
  route.draft={ serial:w.serial, model:w.model, bomRef:w.model, displayModel:modelLabel(w.model), hub:w.hub||"", customer:w.customer?{...w.customer}:null, tech:w.tech, status:w.status, items:w.items.map(it=>({...it})), receiptNote:w.receiptNote, internalNote:w.internalNote, savedId:w.id, schedTech:w.booking?w.booking.tech:"auto", schedDate:w.booking?w.booking.date:todayISO(), loc:w.loc||"Workbench" };
  bomStampItems(route.draft);
  render();
}
function wireFleet(){
  const f=route.fleet;
  const q=document.getElementById("vq"); if(q) q.oninput=()=>{ f.q=q.value; const pos=q.selectionStart; refreshFleet(); const q2=document.getElementById("vq"); if(q2){ q2.focus(); q2.setSelectionRange(pos,pos); } };
  const h=document.getElementById("vhub"); if(h) h.onchange=()=>{ f.hub=h.value; refreshFleet(); };
  const t=document.getElementById("vtype"); if(t) t.onchange=()=>{ f.type=t.value; refreshFleet(); };
  document.querySelectorAll("[data-startwo]").forEach(b=>b.onclick=()=>startWoForBike(state.bikes[+b.dataset.startwo]));
  document.querySelectorAll("[data-openwo]").forEach(b=>b.onclick=()=>{ const w=state.workOrders.find(x=>x.id===b.dataset.openwo); if(w) openWoInEditor(w); });
  document.querySelectorAll("[data-vbom]").forEach(b=>b.onclick=()=>{ const s=bomSplit(state.bikes[+b.dataset.vbom].model); route.bom.brand=s.brand; route.bom.model=s.model; route.bom.group=""; route.bom.q=""; go("bom"); });
  document.querySelectorAll("[data-vrm]").forEach(b=>b.onclick=()=>{
    const v=state.bikes[+b.dataset.vrm]; if(!v) return;
    if(!confirm("Remove "+v.serial+" ("+modelLabel(v.model)+") from the fleet? Its work orders stay.")) return;
    state.bikes.splice(+b.dataset.vrm,1); persist(); refreshFleet(); toast(v.serial+" removed");
  });
  const o=document.getElementById("vOpen"); if(o) o.onclick=()=>{ fleetForm.open=true; refreshFleet(); const s=document.getElementById("vSerial"); if(s) s.focus(); };
  const c=document.getElementById("vCancel"); if(c) c.onclick=()=>{ fleetForm.open=false; refreshFleet(); };
  const vb=document.getElementById("vBrand"); if(vb) vb.onchange=()=>{ const keep=snapFleetForm(); fleetForm.brand=vb.value; fleetForm.model=""; refreshFleet(); restoreFleetForm(keep); };
  const vm=document.getElementById("vModel"); if(vm) vm.onchange=()=>{ fleetForm.model=vm.value; };
  const a=document.getElementById("vAdd"); if(a) a.onclick=()=>{
    const serial=document.getElementById("vSerial").value.trim();
    const brand=document.getElementById("vBrand").value, model=document.getElementById("vModel").value;
    const err=document.getElementById("vErr");
    if(!serial){ err.textContent="Serial number is required."; return; }
    if(state.bikes.some(x=>x.serial.toLowerCase()===serial.toLowerCase())){ err.textContent=serial+" is already in the fleet."; return; }
    if(!model){ err.textContent="Pick a model from the BOM."; return; }
    const name=document.getElementById("vCust").value.trim(), email=document.getElementById("vEmail").value.trim(), phone=document.getElementById("vPhone").value.trim();
    const ref=bomRef(brand,model);
    state.bikes.unshift({serial, model:ref, hub:document.getElementById("vHub").value, customer:name||email||phone?{name,email,phone}:null});
    const cat=catalogFor(ref); Object.keys(cat).forEach(g=>cat[g].forEach(p=>{ const k=ref+"|"+g+"|"+p; if(state.stock[k]===undefined) state.stock[k]=0; }));
    fleetForm.open=false; persist(); refreshFleet(); toast(serial+" added · "+modelLabel(ref));
  };
}
function snapFleetForm(){ const o={}; ["vSerial","vHub","vCust","vEmail","vPhone"].forEach(id=>{ const e=document.getElementById(id); if(e) o[id]=e.value; }); return o; }
function restoreFleetForm(o){ Object.keys(o).forEach(id=>{ const e=document.getElementById(id); if(e) e.value=o[id]; }); }

let teamUsers=null, teamErr="";
async function loadTeam(){
  try{ const r=await svcFetch("/svc/users"); const j=await r.json(); if(!r.ok) throw new Error(j.error||"Couldn't load"); teamUsers=j.users; teamErr=""; }
  catch(e){ teamErr=e.message; teamUsers=teamUsers||[]; }
  if(route.tab==="team"){ const v=document.getElementById("view"); v.innerHTML=viewTeam(); wireTeam(); }
}
async function teamCall(body){
  const r=await svcFetch("/svc/users",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||"Save failed");
  teamUsers=j.users; return j;
}
async function sendInvite(email){
  const r=await svcFetch("/svc/invite",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||"Invite failed");
  return j;
}

function roleOptions(sel){ return ROLES.map(r=>`<option value="${esc(r.id)}" ${sel===r.id?'selected':''}>${esc(r.name)}</option>`).join(""); }
function wireTeam(){
  document.querySelectorAll("[data-nav2]").forEach(b=>b.onclick=()=>go(b.dataset.nav2));
  const add=document.getElementById("uAdd"); if(add) add.onclick=async()=>{
    const err=document.getElementById("uErr"); err.textContent="";
    const body={action:"create",name:document.getElementById("uName").value,email:document.getElementById("uEmail").value,role:document.getElementById("uRole").value,hub:document.getElementById("uHub").value};
    add.disabled=true;
    try{
      await teamCall(body);
      if(/^tech$|techn/i.test(body.role+" "+roleName(body.role)) && document.getElementById("uSched").checked && !state.crew.includes(body.name.trim())){ state.crew.push(body.name.trim()); persist(); }
      let msg=body.name+" added.";
      if(document.getElementById("uInvite").checked){
        try{ const j=await sendInvite(body.email); msg+=j.sent?" Invite sent to "+body.email+".":" They already have a login, so they can sign in now."; }
        catch(e){ msg+=" Couldn't send the invite: "+e.message; }
      }
      toast(msg);
      const v=document.getElementById("view"); v.innerHTML=viewTeam(); wireTeam();
    }catch(e){ err.textContent=e.message; add.disabled=false; }
  };
  const upd=async(body,okMsg)=>{ try{ await teamCall(body); toast(okMsg); }catch(e){ toast(e.message,"err"); } const v=document.getElementById("view"); v.innerHTML=viewTeam(); wireTeam(); };
  document.querySelectorAll("[data-urole]").forEach(s=>s.onchange=()=>upd({action:"update",id:s.dataset.urole,role:s.value},"Role updated"));
  document.querySelectorAll("[data-uhub]").forEach(s=>s.onchange=()=>upd({action:"update",id:s.dataset.uhub,hub:s.value},"Hub updated"));
  document.querySelectorAll("[data-uact]").forEach(b=>b.onclick=()=>{ const u=teamUsers.find(x=>x.id===b.dataset.uact); upd({action:"update",id:u.id,active:!u.active}, u.name+(u.active?" turned off":" turned on")); });
  document.querySelectorAll("[data-uemail]").forEach(b=>b.onclick=()=>{ const u=teamUsers.find(x=>x.id===b.dataset.uemail); const e=prompt("Email for "+u.name+":",u.email||""); if(e) upd({action:"update",id:u.id,email:e.trim()},"Email updated"); });
  document.querySelectorAll("[data-uinv]").forEach(b=>b.onclick=async()=>{ const u=teamUsers.find(x=>x.id===b.dataset.uinv); b.disabled=true;
    try{ const j=await sendInvite(u.email); toast(j.sent?"Invite sent to "+u.email:u.email+" already has a login. They can sign in, or use Forgot your password."); }
    catch(e){ toast(e.message,"err"); } b.disabled=false; });
  document.querySelectorAll("[data-udel]").forEach(b=>b.onclick=()=>{ const u=teamUsers.find(x=>x.id===b.dataset.udel); if(confirm("Remove "+u.name+"'s access to Pandaworks?")) upd({action:"delete",id:u.id},u.name+" removed"); });
}

function openRole(r){

  const close=()=>{ root.innerHTML=""; };

function wirePandacare(){ if(!route.draft){ route.tab="orders"; render(); return; } wireEditor(); }

function wireEditor(){
  if(!route.draft) return;
  const d=route.draft;
  const dirty=()=>{ d.dirty=true; const e=document.querySelector(".wo2-top .dirty"); if(e) e.textContent="Unsaved changes"; };
  document.querySelectorAll("[data-crumb]").forEach(a=>a.onclick=e=>{ e.preventDefault(); if(d.dirty&&!confirm("Leave without saving your changes?")) return; route.draft=null; go(a.dataset.crumb); });
  document.querySelectorAll("[data-chip]").forEach(b=>b.onclick=()=>{ closePop(); d.itemQ=""; d.activeGroup=b.dataset.chip; rerenderEditor(); });
  document.querySelectorAll("[data-part]").forEach(tile=>tile.onclick=(e)=>{ e.stopPropagation(); openPop(tile, tile.dataset.g, tile.dataset.p); });
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ d.items.splice(+b.dataset.rm,1); d.dirty=true; rerenderEditor(); });
  document.querySelectorAll("[data-lineact]").forEach(s=>s.onchange=()=>{ const it=d.items[+s.dataset.lineact]; if(Number(it.mins)===defaultMins(it.action,it.part)||!(Number(it.mins)>0)) it.mins=defaultMins(s.value,it.part); it.action=s.value; d.dirty=true; rerenderEditor(); });
  document.querySelectorAll("[data-linemins]").forEach(inp=>{ inp.oninput=()=>{ d.items[+inp.dataset.linemins].mins=Math.max(0,Math.round(Number(inp.value)||0)); dirty(); }; inp.onchange=()=>rerenderEditor(); });
  document.querySelectorAll("[data-mindef]").forEach(b=>b.onclick=()=>{ const it=d.items[+b.dataset.mindef]; if(!it) return; state.settings=state.settings||{}; state.settings.laborTimes=state.settings.laborTimes||{}; state.settings.laborTimes[it.action+"|"+it.part]=Number(it.mins); persist(); rerenderEditor(); toast(it.action+" "+it.part+" now defaults to "+it.mins+" min"); });
  document.querySelectorAll("[data-soline]").forEach(b=>b.onclick=()=>openSpecialOrder(+b.dataset.soline));
  const lq=document.getElementById("woLabQ"), la=document.getElementById("woLabAdd");
  const addLabor=()=>{ const v=(lq.value||"").trim(); if(!v){ lq.focus(); return; }
    const li=laborItem(v)||laborItems().find(x=>x.name.toLowerCase()===v.toLowerCase())||laborItems().find(x=>x.name.toLowerCase().includes(v.toLowerCase()));
    if(!li){ toast("No labor item called “"+v+"”. Pick one from the list","err"); return; }
    d.items.push({category:"Labor", part:li.name, action:"Labor", note:"", partNo:"", mins:defaultMins("Labor",li.name), price:Number(li.price)||0});
    d.dirty=true; rerenderEditor(); const q2=document.getElementById("woLabQ"); if(q2) q2.focus(); };
  if(la) la.onclick=addLabor;
  if(lq){ lq.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); addLabor(); } }; lq.oninput=e=>{ if(e.inputType==="insertReplacementText"&&laborItem(lq.value.trim())) addLabor(); }; }
  document.querySelectorAll("[data-qc]").forEach(b=>b.onclick=()=>qcAction(b.dataset.qc));
  const pq=document.getElementById("woPartQ"), pa=document.getElementById("woPartAdd");
  const addPart=()=>{ const v=(pq.value||"").trim(); if(!v){ pq.focus(); return; }
    const lv=v.toLowerCase(), all=lsParts.parts||[];
    const p=all.find(x=>lsLabel(x)===v)||all.find(x=>lsPn(x)&&lsPn(x).toLowerCase()===lv)||all.find(x=>x.upc===v)||all.find(x=>x.name.toLowerCase().includes(lv));
    if(!p){ toast("No Lightspeed part matches “"+v+"”","err"); return; }
    d.items.push({category:"Part", part:p.name, action:"Replace", note:"", partNo:lsPn(p), lsId:p.id, price:Number(p.price)||0, mins:defaultMins("Replace",p.name)});
    d.dirty=true; rerenderEditor(); const q2=document.getElementById("woPartQ"); if(q2) q2.focus(); };
  if(pa) pa.onclick=addPart;
  if(pq){ pq.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); addPart(); } }; pq.oninput=e=>{ if(e.inputType==="insertReplacementText") addPart(); }; }
  const cg=document.querySelector("[data-custgo]"); if(cg) cg.onclick=()=>{ if(d.dirty&&!confirm("Leave without saving your changes?")) return; openCustomer(custRef(d.customer||{})); };

function closePop(){

}
function openPop(anchor,g,p){
  closePop();
  const d=route.draft; if(!d) return;
  const found=d.items.find(it=>it.category===g&&it.part===p);
  const cur=found?found.action:null;
  const pop=document.createElement("div");
  pop.className="pop"; pop.id="actPop";
  pop.innerHTML = ACTIONS.map(a=>`<button data-a="${a}" class="${cur===a?'on':''}">${a}</button>`).join("")
    + (cur?`<button class="pop-x" data-x title="Remove from order">✕</button>`:"");
  document.body.appendChild(pop);
  const r=anchor.getBoundingClientRect();
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  let x=r.left+window.scrollX, y=r.bottom+window.scrollY+6;
  const maxX=window.scrollX+document.documentElement.clientWidth-pw-10;
  if(x>maxX) x=maxX;
  if(r.bottom+ph+16>window.innerHeight) y=r.top+window.scrollY-ph-6;
  pop.style.left=x+"px"; pop.style.top=y+"px";
  pop.onclick=e=>e.stopPropagation();
  pop.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>applyAction(g,p,b.dataset.a));
  const xb=pop.querySelector("[data-x]"); if(xb) xb.onclick=()=>removePart(g,p);
  setTimeout(()=>document.addEventListener("click", closePop),0);
}
function applyAction(g,p,a){
  const d=route.draft; if(!d) return;
  const idx=d.items.findIndex(it=>it.category===g&&it.part===p);
  let removed=false;
  if(idx>=0){
    if(d.items[idx].action===a){ d.items.splice(idx,1); removed=true; }
    else { const it=d.items[idx]; if(Number(it.mins)===defaultMins(it.action,it.part)) it.mins=defaultMins(a,p); it.action=a; }
  } else {
    d.items.push({category:g, part:p, action:a, note:"", partNo:bomPartNo(d.bomRef,g,p), mins:defaultMins(a,p)});
  }
  d.dirty=true;
  closePop(); rerenderEditor();
  if(removed) return;
  const tile=document.querySelector('.ptile[data-g="'+CSS.escape(g)+'"][data-p="'+CSS.escape(p)+'"]');
  openNotePop(tile, g, p, a==="Warranty");
}

function openNotePop(anchor,g,p,thenWarranty){
  closePop();
  const d=route.draft; if(!d) return;
  const it=d.items.find(x=>x.category===g&&x.part===p); if(!it) return;
  const done=()=>{ closePop(); rerenderEditor(); if(thenWarranty) openWarrantyDesk(g,p); };
  const pop=document.createElement("div");
  pop.className="pop"; pop.id="actPop";
  pop.innerHTML=`<div style="display:flex;flex-direction:column;gap:8px;min-width:320px">
    <div style="font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)">${esc(it.action)} · ${esc(p)} — note for the tech</div>
    <input class="inp" id="notePopInp" placeholder="One line on why (e.g. squealing under load)" value="${esc(it.note||"")}" style="width:100%">
    <div style="display:flex;gap:6px">
      <button class="btn btn-primary btn-sm" id="noteSave" style="flex:1">Save note</button>
      <button class="btn btn-sm" id="noteSkip">Skip</button>
    </div>
  </div>`;
  document.body.appendChild(pop);
  if(anchor){
    const r=anchor.getBoundingClientRect();
    const pw=pop.offsetWidth, ph=pop.offsetHeight;
    let x=r.left+window.scrollX, y=r.bottom+window.scrollY+6;
    const maxX=window.scrollX+document.documentElement.clientWidth-pw-10;
    if(x>maxX) x=maxX;
    if(r.bottom+ph+16>window.innerHeight) y=r.top+window.scrollY-ph-6;
    pop.style.left=x+"px"; pop.style.top=y+"px";
  } else {
    pop.style.left=Math.max(10,(document.documentElement.clientWidth-pop.offsetWidth)/2+window.scrollX)+"px";
    pop.style.top=(window.scrollY+180)+"px";
  }
  pop.onclick=e=>e.stopPropagation();
  const inp=document.getElementById("notePopInp");
  inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
  const save=()=>{ it.note=inp.value.trim(); done(); };
  document.getElementById("noteSave").onclick=save;
  document.getElementById("noteSkip").onclick=done;
  inp.onkeydown=e=>{ if(e.key==="Enter") save(); if(e.key==="Escape") done(); };
  setTimeout(()=>document.addEventListener("click", closePop),0);
}
function removePart(g,p){
  const d=route.draft; if(!d) return;
  const idx=d.items.findIndex(it=>it.category===g&&it.part===p);
  if(idx>=0) d.items.splice(idx,1);
  d.dirty=true; closePop(); rerenderEditor();
}

function saveWorkOrder(){
  const d=route.draft;
  const missing=d.items.filter(it=>!(Number(it.mins)>0));
  if(missing.length){ toast("Every labor line needs a time. Add minutes for "+missing.map(it=>it.part).join(", "),"err"); rerenderEditor(); const f=document.querySelector(".wo-min.bad"); if(f) f.focus(); return; }
  let status = d.status;
  const id = d.savedId || ("WO-"+(state.seq++));
  let wo = state.workOrders.find(w=>w.id===id);
  const payload = {
    id, serial:d.serial, model:d.model, displayModel:modelLabel(d.model), bomRef:d.model, hub:d.hub||"", writtenBy:(wo&&wo.writtenBy)||(currentUser?currentUser.name:""), customer:d.customer?{...d.customer}:null, tech:d.tech,
    status, createdAt: wo? wo.createdAt : new Date().toISOString(),
    items:d.items.map(it=>({...it, mins:Math.round(Number(it.mins)), laborAmt:laborCharge(it), partAmt:partCharge(it)})), receiptNote:d.receiptNote||"", internalNote:d.internalNote||"",
    totals:Object.assign(totalsFor(d.items),{mins:woMins(d)}), updatedAt:new Date().toISOString(),
    inventoryApplied: wo? wo.inventoryApplied : false
  };
  if(wo){ Object.assign(wo,payload); } else { state.workOrders.unshift(payload); wo=payload; }
  const wantTech = d.schedTech||"auto", wantDate = d.schedDate||todayISO();
  const needsSched = !wo.booking || wo.booking.date!==wantDate || (wantTech!=="auto" && wo.booking.tech!==wantTech);
  if(needsSched){
    const prev=wo.booking; wo.booking=null;
    const a=autoAssign(wantDate, wantTech==="auto"?null:wantTech, wo.hub);
    wo.booking={tech:a.tech, date:a.date, hour:a.hour};
    if(a.full) toast("Heads up: "+a.tech+" is fully booked "+fmtDayShort(a.date)+" — double-booked the last slot","err");
    else if(!prev) toast("Scheduled "+fmtDayShort(a.date)+", "+fmtHour(a.hour)+" with "+a.tech);
  }
  wo.tech=wo.booking.tech; d.tech=wo.tech;
  if(isDone(status) && !wo.inventoryApplied){
    const lsUse=[];
    wo.items.forEach(it=>{ if(!consumesStock(it.action)) return; if(it.lsId){ if(wo.hub) lsUse.push({id:it.lsId,hub:wo.hub,delta:-(Number(it.qty)||1)}); return; } const k=wo.model+"|"+it.category+"|"+it.part; state.stock[k]=Math.max(0,(state.stock[k]||0)-1); });
    lsAdjust(lsUse);
    wo.inventoryApplied=true;
  }
  if(isDone(status)){ if(!wo.completedAt) wo.completedAt=new Date().toISOString(); wo.partsArrived=false; } else wo.completedAt=null;
  d.savedId=id; d.status=status; d.dirty=false; noteRecent(id);
  persist(); toast("Saved "+id);
  rerenderEditor();
  const vi=document.getElementById("viewInvoice"); if(vi) vi.scrollIntoView({behavior:"smooth",block:"center"});
}

function qcAction(kind){
  if(!can("qc")){ toast("Your role can't pass or bounce QC","err"); return; }
  const d=route.draft; if(!d||!d.savedId) return;
  const w=state.workOrders.find(x=>x.id===d.savedId); if(!w) return;
  let reason="";
  if(kind==="bounce"){ reason=prompt("Why is it bouncing back? "+(w.tech||"The tech")+" sees this on the work order.",""); if(reason===null) return; reason=reason.trim(); if(!reason){ toast("Add a reason for the bounce","err"); return; } }
  w.qcEvents=w.qcEvents||[];
  w.qcEvents.push({event:kind==="pass"?"pass":"bounce", by:currentUser?currentUser.name:"", at:new Date().toISOString(), reason, tech:w.tech||""});
  if(w.tech&&currentUser&&w.tech===currentUser.name) toast("Heads up: you're QCing your own work","err");
  if(kind==="bounce"){ d.status="In Progress"; d.internalNote=((d.internalNote||"")+"\nBounced by "+(currentUser?currentUser.name:"")+": "+reason).trim(); }
  else d.status="Finished";
  saveWorkOrder();
}

  if(!f.brand || brands.indexOf(f.brand)<0) f.brand=brands[0];

  if(!f.model || models.indexOf(f.model)<0) f.model=models[0]||"";
  const all=bomAllModels();
  const q=(f.q||"").trim().toLowerCase();

  const brandChips=brands.map(b=>`<button data-bbrand="${esc(b)}" class="${f.brand===b?'on':''}">${esc(b)}<span class="nsel" style="background:${f.brand===b?'#7fd6a2':'#c9d3cb'};color:#12281c">${bomModelsOf(b).length}</span></button>`).join("");
  const modelChips=models.length?models.map(m=>{ const c=bomCount(f.brand,m); return `<button data-bmodel="${esc(m)}" class="${f.model===m?'on':''}" title="${c.have} of ${c.total} parts have a part number">${esc(m)}<span class="nsel" style="background:${c.have?'var(--ok)':'#c9d3cb'};${c.have?'':'color:#12281c'}">${c.have}</span></button>`; }).join("")

  const groupChips=[`<button data-bgroup="" class="${!f.group?'on':''}">All systems</button>`].concat(groups.map(g=>`<button data-bgroup="${esc(g)}" class="${f.group===g?'on':''}">${esc(g)}</button>`)).join("");

  let table="";
  if(q){
    const rows=[];
    all.forEach(x=>groups.forEach(g=>(BOM_PARTS[g]||[]).forEach(p=>{
      const v=bomVal(x.brand,x.model,g,p);
      const hay=(x.brand+" "+x.model+" "+g+" "+p+" "+v).toLowerCase();
      if(hay.includes(q)) rows.push({x,g,p,v});

        <td class="muted">${esc(r.g)}</td>
        <td style="font-weight:600">${esc(r.p)}</td>
        <td class="mono ${bomIsPlaceholder(r.v)?'muted':''}" style="font-size:13px">${esc(r.v||"—")} ${pnLink(r.x.ref,r.v)}</td>
      </tr>`).join(""):`<tr><td colspan="4" class="empty">Nothing matches “${esc(f.q)}”.</td></tr>`}</tbody>
    </table>
    ${rows.length>300?`<div class="hint-line" style="padding:10px 14px">Showing the first 300 of ${rows.length} matches — narrow the search.</div>`:""}`;
  } else if(f.model){
    const shown=f.group?[f.group]:groups;
    const body=shown.map(g=>(BOM_PARTS[g]||[]).map((p,i)=>{
      const v=bomVal(f.brand,f.model,g,p), ed=bomIsEdited(f.brand,f.model,g,p), ph=bomIsPlaceholder(v);
      return `<tr>
        ${i===0?`<td rowspan="${BOM_PARTS[g].length}" class="bom-sys">${esc(g)}</td>`:""}

        <td><input class="inp bom-cell mono ${ph?'ph':''} ${ed?'edited':''}" data-bg="${esc(g)}" data-bp="${esc(p)}" value="${esc(v)}" placeholder="not listed" title="${esc(v)}"></td>
        <td style="text-align:right;white-space:nowrap">${pnLink(bomRef(f.brand,f.model),v)} ${ed?`<button class="btn btn-sm" data-breset="1" data-bg="${esc(g)}" data-bp="${esc(p)}" title="Back to the spreadsheet value">↺ sheet</button>`:""}</td>
      </tr>`;
    }).join("")).join("");
    table=`<table class="grid-tbl bom-tbl">
      <thead><tr><th style="width:150px">System</th><th style="width:220px">Part</th><th>Part number / spec <span style="font-weight:500;text-transform:none;letter-spacing:0">— click to edit, Enter to save</span></th><th></th></tr></thead>
      <tbody>${body}</tbody>
    </table>`;
  } else {
    table=`<div class="empty" style="padding:30px">Add a model for ${esc(f.brand)} to start its bill of materials.</div>`;
  }

        <div id="bmNewBrandWrap" style="display:none"><div class="lbl2">New brand name</div><input class="inp" id="bmNewBrand" placeholder="e.g. Aventon" style="width:160px"></div>

        <div><div class="lbl2">Copy part numbers from</div><select class="inp" id="bmCopy" style="width:260px"><option value="">— start empty —</option>${all.map(x=>`<option value="${esc(x.ref)}">${esc(x.brand)} · ${esc(x.model)}</option>`).join("")}</select></div>
        <button class="btn btn-primary" id="bmAdd">Add model</button>
        <button class="btn" id="bmCancel">Cancel</button>
      </div>
      <div id="bmErr" class="hint-line" style="color:var(--red);margin-top:6px"></div>

          <h2 class="section-title">Vehicle BOM</h2>
          <span class="muted" style="font-size:13.5px"><b>${brands.length}</b> brands · <b>${all.length}</b> models</span>
          <div class="spacer"></div>
          <button class="btn btn-sm" id="bExp">⬇ Export CSV</button>
          <button class="btn btn-sm" id="bAddOpen">＋ Add model</button>
        </div>
        <p class="hint-line" style="margin:0">Bill of materials per model, seeded from the Vehicle BOM sheet. When a work order is linked to a BOM, every part on the service grid shows its OEM part number — so “replace brake pads” on a Haul ST means <span class="mono">S230700001</span>, not a guess. Click any cell to correct it; edits save to the shared backend and show up on work orders immediately.</p>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <input class="inp" id="bq" placeholder="Search every brand — part number, part name, model…" value="${esc(f.q||"")}" style="width:340px;max-width:100%">
          ${f.q?`<button class="btn btn-sm" id="bqClear">Clear search</button>`:""}
        </div>
      </div>
      ${q?"":`
      <div class="pad" style="padding-top:14px;padding-bottom:0">
        <div class="lbl2">Brand</div>
        <div class="chips" style="margin:6px 0 10px">${brandChips}</div>
        <div class="lbl2">Model</div>
        <div class="chips" style="margin:6px 0 10px">${modelChips}</div>
        ${f.model?`<div class="lbl2">System</div><div class="chips" style="margin:6px 0 14px">${groupChips}</div>`:""}
        ${cnt?`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
          <span class="inv-badge ${cnt.have?'ok':'out'}">${cnt.have} of ${cnt.total} parts have a part number</span>
          ${isAdded?`<span class="muted" style="font-size:12.5px">Added in-app — not in the sheet yet.</span><button class="btn btn-sm" id="bDelModel" style="color:var(--red);border-color:#e0b8b3">Remove model</button>`:""}
        </div>`:""}
      </div>`}
      <div style="overflow-x:auto">${table}</div>
      ${addForm}
    </div>`;
}

function refreshBom(){ if(route.tab!=="bom"||route.invoiceId) return; const y=window.scrollY; const v=document.getElementById("view"); v.innerHTML=viewBom(); wireBom(); window.scrollTo(0,y); }

function wireBom(){
  if(!can("editBom")){ document.querySelectorAll("#view input[data-bg], #view [data-breset], #bmOpen, #bmAdd, #bmRemove").forEach(el=>{ el.disabled=true; if(el.tagName==="BUTTON") el.style.display="none"; }); }
  const f=route.bom;
  const q=document.getElementById("bq"); if(q) q.oninput=()=>{ f.q=q.value; const pos=q.selectionStart; refreshBom(); const q2=document.getElementById("bq"); if(q2){ q2.focus(); q2.setSelectionRange(pos,pos); } };
  const qc=document.getElementById("bqClear"); if(qc) qc.onclick=()=>{ f.q=""; refreshBom(); };
  document.querySelectorAll("[data-bbrand]").forEach(b=>b.onclick=()=>{ f.brand=b.dataset.bbrand; f.model=""; f.group=""; refreshBom(); });
  document.querySelectorAll("[data-bmodel]").forEach(b=>b.onclick=()=>{ f.model=b.dataset.bmodel; refreshBom(); });
  document.querySelectorAll("[data-bgroup]").forEach(b=>b.onclick=()=>{ f.group=b.dataset.bgroup; refreshBom(); });
  document.querySelectorAll("[data-bjump]").forEach(tr=>tr.onclick=()=>{ const s=bomSplit(tr.dataset.bjump); f.brand=s.brand; f.model=s.model; f.group=tr.dataset.bjgroup; f.q=""; refreshBom(); });
  document.querySelectorAll(".bom-cell").forEach(inp=>{
    const commit=()=>{ if(inp.value===bomVal(f.brand,f.model,inp.dataset.bg,inp.dataset.bp)) return; bomSetVal(f.brand,f.model,inp.dataset.bg,inp.dataset.bp,inp.value); refreshBom(); toast(inp.dataset.bp+" updated for "+f.model); };
    inp.onchange=commit;
    inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); inp.blur(); } if(e.key==="Escape"){ inp.value=bomVal(f.brand,f.model,inp.dataset.bg,inp.dataset.bp); inp.blur(); } };
  });
  document.querySelectorAll("[data-breset]").forEach(b=>b.onclick=()=>{ bomSetVal(f.brand,f.model,b.dataset.bg,b.dataset.bp,bomSeedVal(f.brand,f.model,b.dataset.bg,b.dataset.bp)); refreshBom(); });
  const ao=document.getElementById("bAddOpen"); if(ao) ao.onclick=()=>{ f.addOpen=true; refreshBom(); const m=document.getElementById("bmModel"); if(m) m.focus(); };
  const ac=document.getElementById("bmCancel"); if(ac) ac.onclick=()=>{ f.addOpen=false; refreshBom(); };
  const bb=document.getElementById("bmBrand"); if(bb) bb.onchange=()=>{ document.getElementById("bmNewBrandWrap").style.display=bb.value==="__new"?"":"none"; };
  const aa=document.getElementById("bmAdd"); if(aa) aa.onclick=()=>{
    const err=document.getElementById("bmErr");
    let brand=document.getElementById("bmBrand").value; if(brand==="__new") brand=(document.getElementById("bmNewBrand").value||"").trim();
    const model=(document.getElementById("bmModel").value||"").trim();
    if(!brand||!model){ err.textContent="Brand and model are both required."; return; }
    if(bomModelsOf(brand).includes(model)){ err.textContent=brand+" "+model+" already exists."; return; }
    state.bomModels.push({brand,model});
    const copy=document.getElementById("bmCopy").value;
    if(copy){ const s=bomSplit(copy); BOM_GROUPS.forEach(g=>(BOM_PARTS[g]||[]).forEach(p=>{ const v=bomVal(s.brand,s.model,g,p); if(v) state.bomEdits[[brand,model,g,p].join("|")]=v; })); }
    persist();
    f.brand=brand; f.model=model; f.group=""; f.addOpen=false; refreshBom();
    toast("Added "+brand+" "+model+(copy?" (copied from "+copy.replace("|"," ")+")":""));
  };
  const dm=document.getElementById("bDelModel"); if(dm) dm.onclick=()=>{
    if(!confirm("Remove "+f.brand+" "+f.model+" from the BOM? Its part numbers will be deleted.")) return;
    state.bomModels=state.bomModels.filter(m=>!(m.brand===f.brand&&m.model===f.model));
    Object.keys(state.bomEdits).forEach(k=>{ if(k.indexOf(f.brand+"|"+f.model+"|")===0) delete state.bomEdits[k]; });
    persist(); f.model=""; refreshBom();
  };
  const ex=document.getElementById("bExp"); if(ex) ex.onclick=()=>{
    const rows=[["brand","model","system","part","part_number","edited_in_app"]];
    const list=f.q?bomAllModels():bomAllModels().filter(x=>x.brand===f.brand&&(!f.model||x.model===f.model));
    list.forEach(x=>BOM_GROUPS.forEach(g=>(BOM_PARTS[g]||[]).forEach(p=>rows.push([x.brand,x.model,g,p,bomVal(x.brand,x.model,g,p),bomIsEdited(x.brand,x.model,g,p)?"yes":"no"]))));
    csvDownload("pandaworks-vehicle-bom-"+stamp()+".csv", rows);
  };
}

function viewInventory(){
  const f=route.invFilters;
  const items=[];
  state.gear.forEach((g,i)=>items.push({
    type:"gear", gi:i, label:gearLabel(g), pn:g.partNumber||"",
    qty:Number(g.qty||0), price:Number(g.price||0), cat:g.category||"Rider Gear", model:"", group:""
  }));
  invModels().forEach(m=>{
    const cat=catalogFor(m);
    Object.keys(cat).forEach(g=>cat[g].forEach(p=>{
      items.push({ type:"part", model:m, group:g, part:p,
        label:p+" "+modelLabel(m), pn:bomPartNo(m,g,p),
        qty:stockOf(m,g,p), price:priceOf(p), cat:"Asset parts / "+g });
    }));
  });
  const cats=["Rider Gear"].concat(BOM_GROUPS);
  let list=items.filter(it=>{
    if(f.type==="gear" && it.type!=="gear") return false;
    if(f.type==="part" && it.type!=="part") return false;
    if(f.model && it.model!==f.model) return false;
    if(f.cat){
      if(f.cat==="Rider Gear"){ if(it.type!=="gear") return false; }
      else if(it.group!==f.cat) return false;
    }
    if(f.level && level(it.qty)!==f.level) return false;
    if(f.q){
      const s=(it.label+" "+it.pn+" "+it.cat+" "+(it.group||"")).toLowerCase();
      if(!s.includes(f.q.toLowerCase())) return false;
    }
    return true;
  });
  const sort=f.sort||"item", dir=f.dir||1;
  list.sort((a,b)=>{
    let c=0;
    if(sort==="qty") c=a.qty-b.qty;
    else if(sort==="price") c=a.price-b.price;
    else c=a.label.localeCompare(b.label);
    return (c*dir) || a.label.localeCompare(b.label);
  });
  const arrow=s=> sort===s ? (dir>0?" ▲":" ▼") : "";
  const body=list.map(it=>{
    const lv=level(it.qty);
    const badge = lv==="out"?`<span class="inv-badge out">Out of stock</span>`:(lv==="low"?`<span class="inv-badge low">Low — ${it.qty} left</span>`:`<span class="inv-badge ok">${it.qty} in stock</span>`);
    if(it.type==="gear"){
      const i=it.gi;
      return `<tr>
        <td><span style="color:var(--green);font-weight:700">🏷 ${esc(it.label)}</span></td>
        <td class="mono muted" style="font-size:12.5px">${esc(it.pn||"—")}</td>
        <td class="mono">${money(it.price)}</td>
        <td class="muted">${esc(it.cat)}</td>
        <td>${badge}</td>
        <td style="text-align:right;white-space:nowrap">
          <span class="stepper">
            <button data-gstep="-1" data-gi="${i}">−</button><input class="gear-qty" data-gqty="${i}" value="${it.qty}" inputmode="numeric"><button data-gstep="1" data-gi="${i}">+</button>
          </span>
          <button class="btn btn-sm" data-gout="${i}" style="margin-left:8px">Scan out</button>
          <button class="btn btn-sm" data-gedit="${i}" style="margin-left:4px">Edit</button>
        </td>
      </tr>`;
    }
    const k=it.model+"|"+it.group+"|"+it.part;
    return `<tr>
      <td><span style="color:var(--green);font-weight:700">🏷 ${esc(it.part)}</span> <span class="muted" style="font-size:12.5px">· ${esc(modelLabel(it.model))}</span></td>
      <td class="mono muted" style="font-size:12px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(it.pn)}">${esc(it.pn||"—")}</td>
      <td class="mono">${money(it.price)}</td>
      <td class="muted">${esc(it.cat)}</td>
      <td>${badge}</td>
      <td style="text-align:right">
        <span class="stepper" data-k="${esc(k)}">
          <button data-step="-1">−</button><span class="n">${it.qty}</span><button data-step="1">+</button>
        </span>
      </td>
    </tr>`;
  }).join("");
  const ed = (gearForm.editIndex!=null) ? (state.gear[gearForm.editIndex]||{}) : {};
  const isEdit = gearForm.editIndex!=null;
  const addForm = gearForm.open?`
    <div class="pad" style="border-top:1px solid var(--line);background:#fbf9f4">
      <div style="font-weight:800;margin-bottom:10px">${isEdit?"Edit part":"New part"}</div>
      <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
        <div><div class="lbl2">Brand</div><input class="inp" id="npBrand" value="${esc(ed.brand||"")}" placeholder="e.g. Abus" style="width:130px"></div>
        <div><div class="lbl2">Model</div><input class="inp" id="npModel" value="${esc(ed.model||"")}" placeholder="e.g. Hyban 2.0" style="width:150px"></div>
        <div><div class="lbl2">Color</div><input class="inp" id="npColor" value="${esc(ed.color||"")}" placeholder="e.g. Velvet Black" style="width:140px"></div>
        <div><div class="lbl2">Size</div><input class="inp" id="npSize" value="${esc(ed.size||"")}" placeholder="e.g. L (56-61)" style="width:120px"></div>
        <div><div class="lbl2">Category</div><input class="inp" id="npCat" value="${esc(ed.category||"Rider Gear")}" style="width:130px"></div>
        <div><div class="lbl2">Part number</div><input class="inp" id="npCode" value="${esc(isEdit?(ed.partNumber||""):(gearForm.barcode||""))}" placeholder="Scan or type" style="width:150px"></div>
        <div><div class="lbl2">Price</div><input class="inp" id="npPrice" type="number" step="0.01" min="0" value="${isEdit?esc(ed.price):""}" placeholder="0.00" style="width:100px"></div>
        <div><div class="lbl2">Qty</div><input class="inp" id="npQty" type="number" min="0" value="${isEdit?esc(ed.qty):"1"}" style="width:80px"></div>
        <button class="btn btn-primary" id="npAdd">${isEdit?"Save changes":"Add part"}</button>
        <button class="btn" id="npCancel">Cancel</button>
        ${isEdit?`<button class="btn" id="npDelete" style="margin-left:auto;color:var(--red);border-color:#e0b8b3">Delete part</button>`:""}
      </div>
      <div id="npErr" class="hint-line" style="color:var(--red);margin-top:6px"></div>
    </div>`:"";
  return `
    <div class="scanbar noprint">
      <b>🏷️ Barcode</b>
      <input class="inp" id="scanInput" placeholder="Scan or type a code, then Enter" autocomplete="off" style="width:250px;max-width:100%">
      <select class="inp" id="scanMode"><option value="-1">Scan out (−1)</option><option value="1">Check in (+1)</option></select>
      <button class="btn" id="camBtn">📷 Camera scan</button>
      <span class="muted" style="font-size:12.5px">USB barcode scanners type into the box automatically. Unknown codes offer to create a new part.</span>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="pad" style="display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <h2 class="section-title">Inventory</h2>
          <span class="muted" style="font-size:13.5px"><b>${list.length}</b> item${list.length===1?"":"s"} found</span>
          <div class="spacer"></div>
          <button class="btn btn-sm" id="expInv">⬇ Export CSV</button>
          <button class="btn btn-sm" id="npOpen">＋ New item</button>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <input class="inp" id="iq" placeholder="Search item descriptions, part numbers…" value="${esc(f.q)}" style="width:300px;max-width:100%">
          <select class="inp" id="icat"><option value="">All categories</option>${cats.map(c=>`<option value="${esc(c)}" ${f.cat===c?'selected':''}>${esc(c)}</option>`).join("")}</select>
          <select class="inp" id="imodel"><option value="">All models</option>${invModels().map(m=>`<option value="${esc(m)}" ${f.model===m?'selected':''}>${esc(modelLabel(m))}</option>`).join("")}</select>
          <select class="inp" id="itype"><option value="">All item types</option><option value="gear" ${f.type==='gear'?'selected':''}>Rider gear</option><option value="part" ${f.type==='part'?'selected':''}>Asset parts</option></select>
          <select class="inp" id="ilevel"><option value="">All stock levels</option><option value="ok" ${f.level==='ok'?'selected':''}>In stock (3+)</option><option value="low" ${f.level==='low'?'selected':''}>Low (1–2)</option><option value="out" ${f.level==='out'?'selected':''}>Out of stock</option></select>
          ${f.q||f.cat||f.model||f.type||f.level?`<button class="btn btn-sm" id="iclear">Clear filters</button>`:""}
        </div>
      </div>
      <div style="overflow-x:auto">
      <table class="grid-tbl">
        <thead><tr>
          <th data-isort="item" style="cursor:pointer" title="Sort">Item${arrow("item")}</th>
          <th>Part number</th>
          <th data-isort="price" style="cursor:pointer" title="Sort">Price${arrow("price")}</th>
          <th>Category</th>
          <th data-isort="qty" style="cursor:pointer" title="Sort">In stock${arrow("qty")}</th>
          <th style="text-align:right">Adjust</th>
        </tr></thead>
        <tbody>${body||'<tr><td colspan="6" class="empty">No items match — try clearing a filter.</td></tr>'}</tbody>
      </table>
      </div>
      ${addForm}
    </div>
    ${can("reset")?`<div style="text-align:right;margin-top:14px" class="noprint"><button class="btn btn-sm" id="resetDemo">Reset demo data</button></div>`:""}`;
}
function wireInventory(){
  const q=document.getElementById("iq"); if(q) q.oninput=()=>{ route.invFilters.q=q.value; const pos=q.selectionStart; const v=document.getElementById("view"); v.innerHTML=viewInventory(); wireInventory(); const q2=document.getElementById("iq"); q2.focus(); q2.setSelectionRange(pos,pos); };
  const m=document.getElementById("imodel"); if(m) m.onchange=()=>{ route.invFilters.model=m.value; refreshInventory(); };
  const l=document.getElementById("ilevel"); if(l) l.onchange=()=>{ route.invFilters.level=l.value; refreshInventory(); };
  const ic=document.getElementById("icat"); if(ic) ic.onchange=()=>{ route.invFilters.cat=ic.value; refreshInventory(); };
  const ity=document.getElementById("itype"); if(ity) ity.onchange=()=>{ route.invFilters.type=ity.value; refreshInventory(); };
  const icl=document.getElementById("iclear"); if(icl) icl.onclick=()=>{ route.invFilters={q:"",cat:"",model:"",type:"",level:"",sort:route.invFilters.sort,dir:route.invFilters.dir}; refreshInventory(); };
  document.querySelectorAll("[data-isort]").forEach(th=>th.onclick=()=>{
    const f=route.invFilters, s=th.dataset.isort;
    if((f.sort||"item")===s){ f.dir=(f.dir||1)*-1; } else { f.sort=s; f.dir=1; }
    refreshInventory();
  });
  const rd=document.getElementById("resetDemo");
  if(rd) rd.onclick=()=>{ if(!confirm("Reset the demo? Every change you made goes away.")) return; location.reload(); };
  document.querySelectorAll(".stepper").forEach(st=>{
    const k=st.dataset.k; if(!k) return;
    st.querySelectorAll("[data-step]").forEach(btn=>btn.onclick=()=>{
      const delta=+btn.dataset.step; state.stock[k]=Math.max(0,(state.stock[k]||0)+delta); persist();
      refreshInventory();
    });
  });
  const si=document.getElementById("scanInput");
  if(si) si.onkeydown=e=>{ if(e.key==="Enter"){ const v=si.value; si.value=""; handleScan(v); } };
  const cb=document.getElementById("camBtn"); if(cb) cb.onclick=openCamModal;
  const no=document.getElementById("npOpen"); if(no) no.onclick=()=>{ gearForm.open=true; gearForm.barcode=""; gearForm.editIndex=null; refreshInventory(); const n=document.getElementById("npBrand"); if(n) n.focus(); };
  const nc=document.getElementById("npCancel"); if(nc) nc.onclick=()=>{ gearForm.open=false; gearForm.editIndex=null; refreshInventory(); };
  const nd=document.getElementById("npDelete"); if(nd) nd.onclick=deleteGearPart;
  document.querySelectorAll("[data-gedit]").forEach(b=>b.onclick=()=>{
    gearForm.open=true; gearForm.editIndex=+b.dataset.gedit; gearForm.barcode="";
    refreshInventory();
    const n=document.getElementById("npBrand"); if(n) n.focus();
  });
  const na=document.getElementById("npAdd"); if(na) na.onclick=addGearPart;
  const ei=document.getElementById("expInv"); if(ei) ei.onclick=exportInventory;
  document.querySelectorAll("[data-gstep]").forEach(b=>b.onclick=()=>{
    const g=state.gear[+b.dataset.gi]; g.qty=Math.max(0,g.qty+(+b.dataset.gstep)); persist(); refreshInventory();
  });
  document.querySelectorAll("[data-gqty]").forEach(inp=>inp.onchange=()=>{
    const g=state.gear[+inp.dataset.gqty]; const v=parseInt(inp.value,10);
    g.qty=(isNaN(v)||v<0)?0:v; persist(); refreshInventory();
  });
  document.querySelectorAll("[data-gout]").forEach(b=>b.onclick=()=>{
    const g=state.gear[+b.dataset.gout];
    if(g.qty<=0){ toast(gearLabel(g)+" is already out of stock","err"); return; }
    g.qty--; persist(); refreshInventory(); toast(gearLabel(g)+" scanned out — "+g.qty+" left");
  });
}

let gearForm={open:false,barcode:"",editIndex:null};
let camStream=null, camTimer=null;

function invModels(){
  const set=new Set(state.bikes.map(b=>b.model));
  Object.keys(state.stock||{}).forEach(k=>{ const p=k.split("|"); if(p.length>=4 && (state.stock[k]||0)>0) set.add(p[0]+"|"+p[1]); });
  return [...set].filter(Boolean).sort((a,b)=>modelLabel(a).localeCompare(modelLabel(b)));
}
function refreshInventory(){
  if(route.tab!=="items"||route.invoiceId) return;
  const y=window.scrollY; const v=document.getElementById("view");
  v.innerHTML=viewInventory(); wireInventory(); window.scrollTo(0,y);
}

function handleScan(codeRaw){
  const code=(codeRaw||"").trim(); if(!code) return;
  const mSel=document.getElementById("scanMode"); const delta=mSel?+mSel.value:-1;
  const g=state.gear.find(x=>(x.partNumber||"").toLowerCase()===code.toLowerCase());
  if(g){
    if(delta<0&&g.qty<=0){ toast(gearLabel(g)+" is already out of stock","err"); return; }
    g.qty=Math.max(0,g.qty+delta); persist(); refreshInventory();
    toast(delta<0?(gearLabel(g)+" scanned out — "+g.qty+" left"):(gearLabel(g)+" checked in — "+g.qty+" in stock"));
  } else if(scanBomPart(code, delta)){
  } else {
    gearForm.open=true; gearForm.barcode=code; gearForm.editIndex=null; refreshInventory();
    toast('Unknown part number "'+code+'" — fill in the form to add it',"err");
    const n=document.getElementById("npBrand"); if(n) n.focus();
  }
  const si=document.getElementById("scanInput"); if(si&&!gearForm.open) si.focus();
}

function scanBomPart(code, delta){
  const want=code.toLowerCase();
  for(const m of invModels()){
    const cat=catalogFor(m);
    for(const g of Object.keys(cat)) for(const p of cat[g]){
      const pn=bomPartNo(m,g,p); if(!pn||pn.toLowerCase()!==want) continue;
      const k=m+"|"+g+"|"+p, q=stockOf(m,g,p);
      if(delta<0&&q<=0){ toast(p+" ("+modelLabel(m)+") is already out of stock","err"); return true; }
      state.stock[k]=Math.max(0,q+delta); persist(); refreshInventory();
      toast((delta<0?"Scanned out ":"Checked in ")+p+" · "+modelLabel(m)+" · "+state.stock[k]+" on hand");
      return true;
    }
  }
  return false;
}
function addGearPart(){
  const brand=document.getElementById("npBrand").value.trim();
  const model=document.getElementById("npModel").value.trim();
  const color=document.getElementById("npColor").value.trim();
  const size=document.getElementById("npSize").value.trim();
  const cat=document.getElementById("npCat").value.trim()||"Rider Gear";
  const code=document.getElementById("npCode").value.trim();
  const price=parseFloat(document.getElementById("npPrice").value)||0;
  const qty=Math.max(0,parseInt(document.getElementById("npQty").value,10)||0);
  const err=document.getElementById("npErr");
  const idx=gearForm.editIndex;
  const isEdit=idx!=null;
  if(!model){ err.textContent="Enter a model."; return; }
  if(!code){ err.textContent="Enter or scan a part number."; return; }
  if(state.gear.some((g,i)=>i!==idx && (g.partNumber||"").toLowerCase()===code.toLowerCase())){
    err.textContent="That part number is already in use."; return;
  }
  const rec={partNumber:code,brand:brand,model:model,color:color,size:size,category:cat,price:price,qty:qty};
  if(isEdit){ state.gear[idx]=rec; } else { state.gear.push(rec); }
  state.gear.sort((a,b)=>gearLabel(a).localeCompare(gearLabel(b)));
  gearForm.open=false; gearForm.barcode=""; gearForm.editIndex=null;
  persist(); refreshInventory();
  toast(isEdit ? (gearLabel(rec)+" updated") : (gearLabel(rec)+" added — "+qty+" in stock"));
}

function deleteGearPart(){
  const idx=gearForm.editIndex; if(idx==null) return;
  const g=state.gear[idx]; if(!g) return;
  if(!confirm("Delete "+gearLabel(g)+" ("+g.partNumber+")? This removes it for everyone.")) return;
  state.gear.splice(idx,1);
  gearForm.open=false; gearForm.editIndex=null; gearForm.barcode="";
  persist(); refreshInventory(); toast(gearLabel(g)+" deleted");
}

function stopCam(){
  if(camTimer){ clearInterval(camTimer); camTimer=null; }
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  closeModal();
}
function openCamModal(){
  const root=document.getElementById("modalRoot");
  const supported=("BarcodeDetector" in window);
  root.innerHTML=`<div class="overlay" data-ovl><div class="modal">
    <h3>📷 Camera scan</h3>
    ${supported?'<video id="camvid" autoplay playsinline muted></video>':''}
    <p class="hint-line" id="camStatus">${supported?'Point the camera at a barcode or QR code…':'This browser does not support camera barcode detection — use a USB scanner or type the code into the scan box instead.'}</p>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="camClose" style="flex:1">Close</button></div>
  </div></div>`;
  document.getElementById("camClose").onclick=stopCam;
  root.querySelector("[data-ovl]").onclick=e=>{ if(e.target===e.currentTarget) stopCam(); };
  if(!supported) return;
  const video=document.getElementById("camvid");
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(s=>{
    camStream=s; video.srcObject=s;
    let det;
    try{ det=new BarcodeDetector({formats:["qr_code","code_128","code_39","ean_13","ean_8","upc_a","upc_e","itf","codabar"]}); }
    catch(e){ try{ det=new BarcodeDetector(); }catch(e2){ document.getElementById("camStatus").textContent="Barcode detection failed to start in this browser."; return; } }
    camTimer=setInterval(()=>{
      det.detect(video).then(codes=>{
        if(codes&&codes.length){ const val=codes[0].rawValue; stopCam(); handleScan(val); }
      }).catch(()=>{});
    },350);
  }).catch(err=>{ const cs=document.getElementById("camStatus"); if(cs) cs.textContent="Camera unavailable: "+err.message; });
}
