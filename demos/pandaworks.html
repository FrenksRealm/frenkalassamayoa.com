    <text class="pg-btxt" id="pgL2" x="291" y="58" text-anchor="middle"></text>
  </g>`;
  pandaSay("Has anyone seen","my 10mm wrench?",true);
  const hunt=[["Not in the drawer.","Not in the bin…"],["Did someone borrow","it again?"],["Fine. I'll just use","the 11mm."]];
  let step=0, resetT=null;
  s.onclick=()=>{
    if(s.classList.contains("cover")) return;
    clearTimeout(resetT);
    pandaSay(...hunt[step]); pandaHop();
    step=(step+1)%hunt.length;
    resetT=setTimeout(()=>{ step=0; pandaSay("Has anyone seen","my 10mm wrench?"); },6000);
  };
  const look=document.getElementById("pgLook");
  const still=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!still) document.getElementById("gate").addEventListener("mousemove",e=>{
    if(s.classList.contains("cover")) return;
    const r=s.getBoundingClientRect(), cx=r.left+r.width*.42, cy=r.top+r.height*.55;
    const dx=Math.max(-1,Math.min(1,(e.clientX-cx)/(window.innerWidth/2))), dy=Math.max(-1,Math.min(1,(e.clientY-cy)/(window.innerHeight/2)));
    look.style.transform=`translate(${dx*7}px,${Math.max(0,dy)*4}px) rotate(${dx*7}deg)`;
  });
}
function pandaSay(l1,l2,first){
  const a=document.getElementById("pgL1"), b=document.getElementById("pgL2"), g=document.getElementById("pgBubble"); if(!a) return;
  a.textContent=l1; b.textContent=l2||"";
  if(!first){ g.classList.remove("again"); void g.getBBox(); g.classList.add("again"); }
}
function pandaHop(){ const s=document.getElementById("pgPanda"); if(!s) return; s.classList.remove("hop","shake"); void s.getBBox(); s.classList.add("hop"); }
function pandaNo(){ const s=document.getElementById("pgPanda"); if(!s) return; s.classList.remove("hop","shake"); void s.getBBox(); s.classList.add("shake"); }
function pandaCover(on){
  const s=document.getElementById("pgPanda"); if(!s) return;
  const was=s.classList.contains("cover"); s.classList.toggle("cover",!!on);
  if(on&&!was){ document.getElementById("pgLook").style.transform=""; pandaSay("I'm not looking,","promise."); }
  if(!on&&was) pandaSay("Has anyone seen","my 10mm wrench?");
}

const DEMO_USER={name:"Demo Manager",email:"demo.manager@pandaworks.test",role:"admin",hub:""};
let currentUser=null, pollTimer=null;
function demoRes(status,body){ return {ok:status>=200&&status<300, status, json:()=>Promise.resolve(JSON.parse(JSON.stringify(body)))}; }
function demoBody(o){ try{ return o&&o.body?JSON.parse(o.body):{}; }catch(e){ return {}; } }
function demoDbStats(){ const ws=(state&&state.workOrders)||[]; let lines=0, mins=0;
  ws.forEach(w=>{ lines+=(w.items||[]).length; if(isDone(w.status)) mins+=woMins(w); });
  return {work_orders:ws.length, lines, points:mins/60, last_sync:new Date().toISOString()}; }
async function svcFetch(url,opts){
  const o=opts||{}, m=String(o.method||"GET").toUpperCase(), b=demoBody(o), path=String(url).split("?")[0];
  await new Promise(r=>setTimeout(r,40));
  if(path==="/svc/assets"){
    if(m==="GET") return demoRes(200,DEMO_FLEET);
    if(b.action==="sync"){ DEMO_FLEET.importedAt=new Date().toISOString(); DEMO_FLEET.importedBy=currentUser?currentUser.name:""; return demoRes(200,{count:DEMO_FLEET.assets.length}); }
    if(Array.isArray(b.assets)){ DEMO_FLEET.assets=b.assets; DEMO_FLEET.source=b.source||"CSV upload"; DEMO_FLEET.importedAt=new Date().toISOString(); DEMO_FLEET.importedBy=currentUser?currentUser.name:""; return demoRes(200,{count:b.assets.length}); }
    return demoRes(400,{error:"Unknown request"});
  }
  if(path==="/svc/parts"){
    if(m==="GET") return demoRes(200,DEMO_PARTS);
    if(b.action==="adjust") return demoRes(200,{ok:true});
    return demoRes(400,{error:"Catalog imports are turned off in the demo"});
  }
  if(path==="/svc/db"){
    if(m==="GET"||b.action==="resync") return demoRes(200,demoDbStats());
    return demoRes(400,{error:"Reporting logins are turned off in the demo"});
  }
  if(path==="/svc/users"){
    if(m==="GET") return demoRes(200,{users:DEMO_USERS});
    if(b.action==="create"){
      const name=String(b.name||"").trim(), email=String(b.email||"").trim().toLowerCase();
      if(!name) return demoRes(400,{error:"Add their name"});
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return demoRes(400,{error:"Add a valid email"});
      if(DEMO_USERS.some(u=>u.email===email)) return demoRes(400,{error:"That email is already on the list"});
      DEMO_USERS.push({id:"u"+Date.now().toString(36), name, email, role:b.role||"tech", hub:b.hub||"", active:true});
      return demoRes(200,{users:DEMO_USERS});
    }
    const u=DEMO_USERS.find(x=>x.id===b.id); if(!u) return demoRes(404,{error:"That person isn't on the list"});
    if(b.action==="update"){ ["role","hub","active","email"].forEach(k=>{ if(b[k]!==undefined) u[k]=b[k]; }); return demoRes(200,{users:DEMO_USERS}); }
    if(b.action==="delete"){ DEMO_USERS.splice(DEMO_USERS.indexOf(u),1); return demoRes(200,{users:DEMO_USERS}); }
    return demoRes(400,{error:"Unknown request"});
  }
  if(path==="/svc/invite") return demoRes(200,{sent:true});
  if(path==="/svc/roles"){
    if(m==="GET") return demoRes(200,{roles:ROLES, perms:PERM_FALLBACK});
    if(b.action==="save"){ const r=b.role||{}, name=String(r.name||"").trim(); if(!name) return demoRes(400,{error:"Give the role a name"});
      const ex=r.id&&ROLES.find(x=>x.id===r.id);
      if(ex){ if(!ex.locked){ ex.name=name; ex.perms=r.perms||[]; } } else ROLES.push({id:"r"+Date.now().toString(36), name, perms:r.perms||[], builtIn:false});
      return demoRes(200,{roles:ROLES, perms:PERM_FALLBACK}); }
    if(b.action==="delete"){ ROLES=ROLES.filter(x=>x.id!==b.id||x.builtIn); return demoRes(200,{roles:ROLES, perms:PERM_FALLBACK}); }
    return demoRes(400,{error:"Unknown request"});
  }
  return demoRes(404,{error:"Not available in the demo"});
}

let ROLES=[
  {id:"admin",name:"Admin",perms:[],builtIn:true,locked:true},
  {id:"lead",name:"Service Lead",perms:["workorders","deletewo","qc","purchasing","bom","assets","inventory","costs","reports","settings"],builtIn:true},
  {id:"tech",name:"Technician",perms:["workorders","qc"],builtIn:true},
  {id:"foh",name:"Front of House",perms:["workorders"],builtIn:true}];
let PERM_LIST=[];
async function loadRoles(){
  try{ const r=await svcFetch("/svc/roles",{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(Array.isArray(j.roles)&&j.roles.length){ ROLES=j.roles; PERM_LIST=j.perms||[]; } } }catch(e){}
}
function roleOf(id){ return ROLES.find(r=>r.id===id); }
function roleName(id){ const r=roleOf(id); return r?r.name:(id||""); }
let previewAs=null;
function who(){ return previewAs||currentUser; }
const PERM_ALIAS={editBom:"bom",manageFleet:"reports",manageTechs:"settings"};
function can(what){
  const u=who(); if(!u||!u.role) return false;
  if(u.role==="admin") return true;
  const r=roleOf(u.role), p=PERM_ALIAS[what]||what;
  return !!(r&&r.perms.includes(p));
}
function lockHub(){ const u=who(); return u&&u.hub&&!can("allhubs")?u.hub:""; }
function hubChoices(){ const l=lockHub(); return l?[l]:HUBS; }

let gMode="loading", gateSkip=false;
let msgTimer=null;
function gateLoading(msg,cycle){
  clearInterval(msgTimer);
  const m=document.getElementById("gMsg"); if(!m) return; m.textContent=msg;
  if(cycle){ let i=0; msgTimer=setInterval(()=>{ m.textContent=cycle[i++%cycle.length]; },260); }
}
const ENTER_MSGS=["Syncing work orders…","Pulling part numbers from the BOM…","Counting stock on the shelves…","Checking the calendar…"];
const PANDA_LINES=["Has anyone seen my 10mm wrench?","Not in the drawer. Not in the bin…","Did someone borrow it again?","Fine. I'll just use the 11mm."];
let pandaStep=0;
function pandaTap(){ toast("🐼 "+PANDA_LINES[pandaStep++%PANDA_LINES.length]); }
async function enterApp(user){
  gMode="entering"; currentUser=user;
  const gate=document.getElementById("gate");
  gateLoading("Clocking in: "+user.name.split(" ")[0]+"…", ENTER_MSGS);
  pandaSay("Welcome in,", user.name.split(" ")[0]+"!"); pandaHop();
  state=normalize(seedState());
  await loadRoles();
  route.mode=user.role==="admin"?"admin":"hub";
  if(!can("reports")) route.mode="hub";
  if(lockHub()) setHubs([lockHub()]);
  route.tab=route.mode==="admin"?"admin":"home";
  if(!route.hubs.length && user.hub) setHub(user.hub);
  route.fleet.hub=route.hub;
  renderWho();
  await Promise.all([hydrate(), loadAssets(), loadParts()]);
  gateLoading("Let's ride!");
  await new Promise(r=>setTimeout(r,gateSkip?0:700));
  render();
  gate.classList.add("gone");
  setSync("ok");
}
function renderWho(){
  const w=document.getElementById("who"); if(!w) return;
  if(!currentUser){ w.innerHTML=""; return; }
  w.innerHTML=`<div><div class="nm" title="${esc(currentUser.name)}">${esc(currentUser.name)}</div><div class="rl">${esc(roleName(currentUser.role))}${currentUser.hub?" · "+esc(currentUser.hub):""}</div></div><div class="av"><svg viewBox="78 19 180 164">${RP_HEAD}</svg></div>`;
  const lg=document.getElementById("lsLogo"); if(lg){ lg.innerHTML=RP_HEAD; lg.style.cursor="pointer"; lg.onclick=pandaTap; }
  const tp=document.getElementById("topPanda"); if(tp) tp.onclick=pandaTap;
  const pv=document.getElementById("pvBtn"); if(pv){ pv.hidden=!(currentUser&&currentUser.role==="admin"||previewAs); pv.textContent=previewAs?"Exit preview":"👁 Preview as employee"; pv.onclick=()=>previewAs?exitPreview():openPreview(); }
  document.getElementById("lsBurger").onclick=openSide;
  document.getElementById("lsScrim").onclick=closeSide;
}
function signOut(){ location.reload(); }
function boot(){
  buildPanda();
  const g=document.getElementById("gate"); if(g) g.addEventListener("click",e=>{ if(!(e.target.closest&&e.target.closest("#pgPanda"))) gateSkip=true; });
  const rs=document.getElementById("demoReset"); if(rs) rs.onclick=()=>location.reload();
  enterApp(DEMO_USER);
}

setSync("local");
boot();
</script>
