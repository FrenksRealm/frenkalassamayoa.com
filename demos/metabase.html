<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub Health dashboard</title>
<style>
  :root {
    --bg: #f9fbfc; --card: #fff; --border: #eeecec; --text: #4c5773; --dark: #2e353b; --muted: #949aab;
    --brand: #509ee3; --brand-light: #ddecfa; --c1: #509ee3; --c2: #88bf4d; --c3: #a989c5; --c4: #ef8c8c; --c5: #f9d45c;
    --red: #ed6e6e; --green: #84bb4c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Lato, "Helvetica Neue", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; }
  /* top bar */
  .top { display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  .burger { width: 32px; height: 32px; border: 0; background: none; border-radius: 6px; color: var(--muted); font-size: 18px; }
  .burger:hover { background: var(--bg); color: var(--brand); }
  .crumbs { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumbs b { color: var(--dark); font-weight: 700; }
  .search { margin-left: auto; display: flex; align-items: center; gap: 8px; width: min(320px, 34vw); height: 34px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); background: var(--bg); }
  .newbtn { height: 34px; padding: 0 14px; border-radius: 8px; border: 0; background: var(--brand); color: #fff; font-weight: 700; white-space: nowrap; }
  /* dashboard header */
  .head { padding: 22px 24px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .head h1 { font-size: 22px; color: var(--dark); font-weight: 900; }
  .head .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .icons { display: flex; gap: 4px; }
  .icons button { width: 34px; height: 34px; border-radius: 8px; border: 0; background: none; color: var(--muted); font-size: 15px; }
  .icons button:hover { background: #fff; color: var(--brand); box-shadow: 0 0 0 1px var(--border); }
  .tabs { display: flex; gap: 22px; padding: 14px 24px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tabs button { border: 0; background: none; padding: 8px 0 12px; color: var(--muted); font-weight: 700; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tabs button.on { color: var(--brand); border-color: var(--brand); }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; padding: 14px 24px; }
  .flt { position: relative; }
  .flt > button { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: #fff; color: var(--dark); font-weight: 700; }
  .flt > button span { color: var(--muted); font-weight: 400; }
  .flt > button.set { border-color: var(--brand); color: var(--brand); background: var(--brand-light); }
  .menu { position: absolute; top: 42px; left: 0; min-width: 190px; background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 22px rgba(0,0,0,.12); padding: 6px; z-index: 9; display: none; }
  .menu.open { display: block; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; color: var(--dark); }
  .menu button:hover, .menu button.on { background: var(--brand-light); color: var(--brand); }
  /* grid */
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; padding: 0 24px 28px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.04); padding: 14px 16px; min-width: 0; position: relative; }
  .card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .card h3 { font-size: 14px; color: var(--dark); font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
  .card h3 small { color: var(--muted); font-weight: 400; font-size: 12px; }
  .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s6 { grid-column: span 6; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
  .scalar .big { font-size: clamp(30px, 3.4vw, 44px); font-weight: 900; color: var(--dark); line-height: 1.1; margin-top: 6px; }
  .scalar .cmp { font-size: 12.5px; margin-top: 6px; color: var(--muted); }
  .up { color: var(--green); font-weight: 700; } .down { color: var(--red); font-weight: 700; }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { font-family: inherit; }
  .bar { cursor: pointer; transition: opacity .15s; }
  .bar:hover { opacity: .8; }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--text); margin: 2px 0 6px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap; user-select: none; }
  th:hover { color: var(--brand); }
  th.num, td.num { text-align: right; }
  td { padding: 9px 10px; border-bottom: 1px solid #f3f3f3; color: var(--dark); white-space: nowrap; }
  tr:hover td { background: #f7fafd; }
  .mini { display: inline-block; height: 8px; border-radius: 4px; background: var(--c1); vertical-align: middle; margin-left: 8px; opacity: .8; }
  .tip { position: fixed; z-index: 20; pointer-events: none; background: #2e353b; color: #fff; padding: 8px 10px; border-radius: 6px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 4px 14px rgba(0,0,0,.25); display: none; }
  .tip b { color: #fff; }
  .pop { position: fixed; z-index: 21; background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 26px rgba(0,0,0,.15); padding: 6px; display: none; min-width: 200px; }
  .pop button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; color: var(--dark); }
  .pop button:hover { background: var(--brand-light); color: var(--brand); }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--dark); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; transition: all .25s; z-index: 30; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .demo-pill { position: fixed; right: 12px; bottom: 12px; z-index: 25; background: #fff; border: 1px dashed var(--brand); color: var(--brand); font-size: 12px; padding: 5px 10px; border-radius: 999px; }
  .note { font-size: 13px; color: var(--text); background: #fffbea; border: 1px solid #f5e6a8; border-radius: 8px; padding: 12px 14px; line-height: 1.5; }
  @media (max-width: 900px) { .s3 { grid-column: span 6; } .s4, .s6, .s8 { grid-column: span 12; } .search { display: none; } }
  @media (max-width: 520px) { .grid { padding: 0 12px 24px; gap: 10px; } .s3 { grid-column: span 12; } .head, .filters { padding-left: 12px; padding-right: 12px; } .tabs { padding: 10px 12px 0; } .newbtn { display: none; } }
</style>
</head>
<body>
<div class="top">
  <button class="burger" type="button" aria-label="Menu" data-off>☰</button>
  <div class="crumbs">Our analytics / Operations / <b>Hub Health</b></div>
  <div class="search">⌕ <span>Search…</span></div>
  <button class="newbtn" type="button" data-off>+ New</button>
</div>

<div class="head">
  <div><h1>Hub Health</h1><div class="sub">Intake, repair and labor across every hub · demo data</div></div>
  <div class="icons">
    <button type="button" title="Refresh" id="refresh">↻</button>
    <button type="button" title="Fullscreen" data-off>⤢</button>
    <button type="button" title="Sharing" data-off>⇪</button>
  </div>
</div>

<div class="tabs" id="tabs">
  <button type="button" class="on" data-tab="overview">Overview</button>
  <button type="button" data-tab="intake">Intake</button>
  <button type="button" data-tab="tech">Technicians</button>
</div>

<div class="filters">
  <div class="flt"><button type="button" id="hubBtn">Hub <span id="hubVal">All</span> ▾</button><div class="menu" id="hubMenu"></div></div>
  <div class="flt"><button type="button" id="rangeBtn">Date range <span id="rangeVal">Last 6 months</span> ▾</button><div class="menu" id="rangeMenu"></div></div>
</div>

<div class="grid" id="grid"></div>

<div class="tip" id="tip"></div>
<div class="pop" id="pop"></div>
<div class="toast" id="toast"></div>
<div class="demo-pill">Demo · invented data</div>

<script>
/* Hub Health — demo. Every number here is generated; nothing connects to anything. */
const HUBS = ["Pluto", "Vega", "Orion", "Atlas", "Nova"];
const MONTHS_ALL = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const TECHS = [
  ["Theo Halvorsen", "Pluto"], ["Ana Petrova", "Pluto"], ["Kofi Mensah", "Pluto"], ["Rory Sullivan", "Pluto"],
  ["Noor Castellanos", "Vega"], ["Hana Sato", "Vega"], ["Ibrahim Diallo", "Vega"],
  ["Sunny Adebayo", "Orion"], ["Tobias Hale", "Orion"], ["Zara Iqbal", "Atlas"], ["Arjun Mehta", "Nova"]];
const state = { hub: "All", range: 6, tab: "overview", sort: ["pts", -1] };
const $ = s => document.querySelector(s);

/* seeded random so each hub always shows the same story */
function rng(seed) { let x = 0; for (const c of seed) x = (x * 31 + c.charCodeAt(0)) >>> 0; return () => ((x = (x * 1664525 + 1013904223) >>> 0) / 4294967296); }
function data() {
  const n = state.range, months = MONTHS_ALL.slice(12 - n), hubs = state.hub === "All" ? HUBS : [state.hub];
  const size = state.hub === "All" ? 1 : { Pluto: .42, Vega: .22, Orion: .16, Atlas: .11, Nova: .09 }[state.hub];
  const r = rng(state.hub + n);
  const intake = months.map((_, i) => +(3.6 + i * (3.9 / Math.max(1, n - 1)) * (n === 6 ? 1 : .55) + (r() - .5) * .5).toFixed(1));
  const repair = months.map(() => +(1.8 + r() * .5).toFixed(1));
  const net = months.map((_, i) => Math.round((r() * 34 - 12 + i * 1.6) * size));
  const util = months.map((_, i) => Math.round(68 + i * (n === 6 ? 2 : 1) + r() * 6));
  const open = Math.round(148 * size + r() * 6), activated = Math.round(212 * size + r() * 8);
  const techs = TECHS.filter(t => hubs.includes(t[1])).map(([name, hub]) => {
    const rr = rng(name + n); const pts = Math.round((40 + rr() * 90) * (n / 6));
    return { name, hub, pts, wo: Math.round(pts / 2.3), pace: +(3 + rr() * 3.4).toFixed(1), qc: +(86 + rr() * 12).toFixed(1) };
  });
  const funnel = [["Received", 100], ["Unboxed", 92], ["Built", 71], ["QC passed", 63], ["Active", 58]].map(([k, v]) => [k, Math.round(v * 3.1 * size)]);
  const aging = [["0–2 days", 34], ["3–5 days", 41], ["6–10 days", 29], ["11–20 days", 17], ["20+ days", 9]].map(([k, v]) => [k, Math.max(1, Math.round(v * size * (1 + r() * .2)))]);
  return { months, intake, repair, net, util, open, activated, techs, funnel, aging };
}

/* ---------- chart builders (values on bars, no axis lines or ticks, every month labeled) ---------- */
function barChart(labels, series, opts = {}) {
  const W = 600, H = opts.h || 230, pad = 26, base = H - 24, top = 22;
  const max = Math.max(...series.flatMap(s => s.values.map(Math.abs))) * 1.15 || 1;
  const hasNeg = series.some(s => s.values.some(v => v < 0));
  const zero = hasNeg ? top + (base - top) / 2 : base, scale = hasNeg ? (base - top) / 2 / max : (base - top) / max;
  const gw = (W - pad * 2) / labels.length, bw = Math.min(46, gw * .7 / series.length);
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  if (hasNeg) out += `<line x1="${pad}" x2="${W - pad}" y1="${zero}" y2="${zero}" stroke="#e6e6e6"/>`;
  labels.forEach((lab, i) => {
    const gx = pad + gw * i + (gw - bw * series.length) / 2;
    series.forEach((s, j) => {
      const v = s.values[i], h = Math.max(1, Math.abs(v) * scale), x = gx + j * bw, y = v >= 0 ? zero - h : zero;
      const color = s.colorFn ? s.colorFn(v) : s.color;
      out += `<rect class="bar" x="${x + 1}" y="${y}" width="${bw - 2}" height="${h}" rx="2" fill="${color}" data-tip="<b>${lab}</b><br>${s.name}: ${s.fmt ? s.fmt(v) : v}" data-lab="${lab}" data-series="${s.name}"/>`;
      out += `<text x="${x + bw / 2}" y="${v >= 0 ? y - 6 : y + h + 13}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c5773">${s.fmt ? s.fmt(v) : v}</text>`;
    });
    out += `<text x="${pad + gw * i + gw / 2}" y="${H - 4}" text-anchor="middle" font-size="12" fill="#949aab">${lab}</text>`;
  });
  return out + `</svg>`;
}
function lineChart(labels, values, opts = {}) {
  const W = 600, H = opts.h || 200, pad = 30, base = H - 26, top = 24;
  const min = Math.min(...values) - 6, max = Math.max(...values) + 4, gw = (W - pad * 2) / (labels.length - 1 || 1);
  const pts = values.map((v, i) => [pad + gw * i, base - (v - min) / (max - min) * (base - top)]);
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img"><path d="M${pts.map(p => p.join(",")).join(" L")}" fill="none" stroke="${opts.color}" stroke-width="2.5"/>`;
  out += `<path d="M${pts[0][0]},${base} L${pts.map(p => p.join(",")).join(" L")} L${pts[pts.length - 1][0]},${base}Z" fill="${opts.color}" opacity=".08"/>`;
  pts.forEach(([x, y], i) => {
    out += `<circle class="bar" cx="${x}" cy="${y}" r="4.5" fill="#fff" stroke="${opts.color}" stroke-width="2.5" data-tip="<b>${labels[i]}</b><br>${opts.name}: ${values[i]}%" data-lab="${labels[i]}" data-series="${opts.name}"/>`;
    out += `<text x="${x}" y="${y - 11}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c5773">${values[i]}%</text>`;
    out += `<text x="${x}" y="${H - 4}" text-anchor="middle" font-size="12" fill="#949aab">${labels[i]}</text>`;
  });
  return out + `</svg>`;
}
function hBars(rows, color) {
  const max = Math.max(...rows.map(r => r[1]));
  return rows.map(([k, v]) => `<div class="bar" style="display:grid;grid-template-columns:110px 1fr 46px;align-items:center;gap:10px;margin:9px 0" data-tip="<b>${k}</b><br>Assets: ${v}" data-lab="${k}" data-series="Assets">
      <span style="font-size:13px;color:#2e353b">${k}</span><span style="height:22px;border-radius:3px;background:${color};width:${Math.max(3, v / max * 100)}%"></span><b style="text-align:right;color:#2e353b">${v}</b></div>`).join("");
}
const card = (cls, title, body, sub = "") => `<div class="card ${cls}"><h3>${title}${sub ? `<small>${sub}</small>` : ""}</h3>${body}</div>`;
const scalar = (title, value, cmp) => `<div class="card s3 scalar"><h3>${title}</h3><div class="big">${value}</div><div class="cmp">${cmp}</div></div>`;

/* ---------- render ---------- */
function render() {
  const d = data(), g = $("#grid"), hubTxt = state.hub === "All" ? "all hubs" : state.hub;
  const last = a => a[a.length - 1], prev = a => a[a.length - 2];
  const pct = (a, b) => Math.round((a - b) / b * 100);
  if (state.tab === "overview") {
    const di = pct(last(d.intake), prev(d.intake)), dr = pct(last(d.repair), prev(d.repair));
    g.innerHTML =
      scalar("Open work orders", d.open, `across ${hubTxt}`) +
      scalar("Avg days in intake", last(d.intake).toFixed(1), `<span class="${di > 0 ? "down" : "up"}">${di > 0 ? "↑" : "↓"} ${Math.abs(di)}%</span> vs. previous month`) +
      scalar("Avg days in repair", last(d.repair).toFixed(1), `<span class="${dr > 0 ? "down" : "up"}">${dr > 0 ? "↑" : "↓"} ${Math.abs(dr)}%</span> vs. previous month`) +
      scalar("Assets activated", d.activated, `last ${state.range} months`) +
      card("s8", "Days per asset: intake vs. repair", `<div class="legend"><span><i style="background:var(--c1)"></i>Intake</span><span><i style="background:var(--c3)"></i>Repair</span></div>` +
        barChart(d.months, [{ name: "Intake days", values: d.intake, color: "#509ee3", fmt: v => v.toFixed(1) }, { name: "Repair days", values: d.repair, color: "#a989c5", fmt: v => v.toFixed(1) }]), "Average, by month") +
      card("s4", "What the data says", `<div class="note"><b>Repair time held flat</b> at about two days. <b>Intake kept climbing</b> — getting new assets built and active was the real bottleneck. That's what changed how we staffed.</div>`) +
      card("s6", "Backlog net change", barChart(d.months, [{ name: "Net change", values: d.net, colorFn: v => v > 0 ? "#ed6e6e" : "#84bb4c", fmt: v => (v > 0 ? "+" : "") + v }], { h: 210 }), "Red = backlog grew") +
      card("s6", "Technician utilization", lineChart(d.months, d.util, { color: "#88bf4d", name: "Utilization" }), "% of shift on labor");
  } else if (state.tab === "intake") {
    g.innerHTML =
      card("s6", "Intake funnel", hBars(d.funnel, "#509ee3"), `last ${state.range} months`) +
      card("s6", "Assets waiting in intake", hBars(d.aging, "#f9d45c"), "by days waiting") +
      card("s12", "Average days in intake", barChart(d.months, [{ name: "Intake days", values: d.intake, color: "#509ee3", fmt: v => v.toFixed(1) }], { h: 210 }), hubTxt);
  } else {
    const rows = [...d.techs].sort((a, b) => (a[state.sort[0]] > b[state.sort[0]] ? 1 : -1) * state.sort[1]);
    const maxPts = Math.max(1, ...d.techs.map(t => t.pts));
    const th = (k, label, num) => `<th class="${num ? "num" : ""}" data-sort="${k}">${label}${state.sort[0] === k ? (state.sort[1] < 0 ? " ↓" : " ↑") : ""}</th>`;
    g.innerHTML =
      scalar("Technicians", d.techs.length, hubTxt) +
      scalar("Labor points", d.techs.reduce((a, t) => a + t.pts, 0), `last ${state.range} months`) +
      scalar("Avg pace", (d.techs.reduce((a, t) => a + t.pace, 0) / Math.max(1, d.techs.length)).toFixed(1), "points per day") +
      scalar("Avg QC pass", (d.techs.reduce((a, t) => a + t.qc, 0) / Math.max(1, d.techs.length)).toFixed(1) + "%", "first-time pass rate") +
      card("s12", "Labor points by technician", `<div style="overflow-x:auto"><table><thead><tr>${th("name", "Technician")}${th("hub", "Hub")}${th("pts", "Points", 1)}${th("wo", "Work orders", 1)}${th("pace", "Pace / day", 1)}${th("qc", "QC pass %", 1)}</tr></thead><tbody>` +
        rows.map(t => `<tr><td>${t.name}</td><td>${t.hub}</td><td class="num">${t.pts}<span class="mini" style="width:${t.pts / maxPts * 80}px"></span></td><td class="num">${t.wo}</td><td class="num">${t.pace}</td><td class="num">${t.qc}</td></tr>`).join("") +
        `</tbody></table></div>`, "click a column to sort");
    g.querySelectorAll("th[data-sort]").forEach(h => h.onclick = () => {
      const k = h.dataset.sort; state.sort = [k, state.sort[0] === k ? -state.sort[1] : (k === "name" || k === "hub" ? 1 : -1)]; render();
    });
  }
}

/* ---------- interactions ---------- */
function menu(btn, list, items, current, set) {
  list.innerHTML = items.map(([v, label]) => `<button type="button" class="${v === current() ? "on" : ""}" data-v="${v}">${label}</button>`).join("");
  btn.onclick = e => { e.stopPropagation(); document.querySelectorAll(".menu").forEach(m => m !== list && m.classList.remove("open")); list.classList.toggle("open"); };
  list.onclick = e => { const b = e.target.closest("button"); if (!b) return; set(b.dataset.v); list.classList.remove("open"); menu(btn, list, items, current, set); render(); };
}
menu($("#hubBtn"), $("#hubMenu"), [["All", "All hubs"], ...HUBS.map(h => [h, h])], () => state.hub, v => {
  state.hub = v; $("#hubVal").textContent = v === "All" ? "All" : v; $("#hubBtn").classList.toggle("set", v !== "All");
});
menu($("#rangeBtn"), $("#rangeMenu"), [["3", "Last 3 months"], ["6", "Last 6 months"], ["12", "Last 12 months"]], () => String(state.range), v => {
  state.range = +v; $("#rangeVal").textContent = "Last " + v + " months"; $("#rangeBtn").classList.toggle("set", v !== "6");
});
$("#tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; state.tab = b.dataset.tab; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b)); render(); };
document.addEventListener("click", e => { if (!e.target.closest(".flt")) document.querySelectorAll(".menu").forEach(m => m.classList.remove("open")); if (!e.target.closest(".pop, .bar")) $("#pop").style.display = "none"; });

const tip = $("#tip"), pop = $("#pop"), toast = $("#toast");
function say(t) { toast.textContent = t; toast.classList.add("show"); clearTimeout(say.t); say.t = setTimeout(() => toast.classList.remove("show"), 2000); }
document.addEventListener("mousemove", e => {
  const b = e.target.closest("[data-tip]");
  if (!b) { tip.style.display = "none"; return; }
  tip.innerHTML = b.dataset.tip; tip.style.display = "block";
  tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px";
});
document.addEventListener("click", e => {
  const b = e.target.closest(".bar"); if (!b) return;
  pop.innerHTML = `<div style="padding:6px 10px 8px;font-size:12px;color:#949aab">${b.dataset.series} · ${b.dataset.lab}</div>
    <button type="button" data-a="See these work orders">See these work orders</button>
    <button type="button" data-a="Break out by hub">Break out by hub</button>
    <button type="button" data-a="Zoom in">Zoom in</button>`;
  pop.style.display = "block";
  pop.style.left = Math.min(innerWidth - 220, e.clientX) + "px"; pop.style.top = Math.min(innerHeight - 160, e.clientY + 8) + "px";
});
pop.onclick = e => { const b = e.target.closest("button"); if (!b) return; pop.style.display = "none";
  if (b.dataset.a === "Break out by hub" && state.hub !== "All") { state.hub = "All"; $("#hubVal").textContent = "All"; $("#hubBtn").classList.remove("set"); menu($("#hubBtn"), $("#hubMenu"), [["All", "All hubs"], ...HUBS.map(h => [h, h])], () => state.hub, v => { state.hub = v; $("#hubVal").textContent = v; $("#hubBtn").classList.toggle("set", v !== "All"); }); render(); say("Showing every hub"); }
  else say("Drill-through is off in the demo"); };
document.querySelectorAll("[data-off]").forEach(b => b.onclick = () => say("That's turned off in the demo"));
$("#refresh").onclick = () => { $("#grid").style.opacity = .4; setTimeout(() => { $("#grid").style.opacity = 1; say("Updated just now"); }, 350); };
render();
</script>
