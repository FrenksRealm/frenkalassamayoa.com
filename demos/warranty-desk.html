<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Warranty Desk</title>
<link rel="icon" href="data:," />
<style>
:root{
  --ink:#1b1815; --paper:#f7f4ee; --panel:#fffefb; --line:#e6e0d4; --line-soft:#efe9dd; --muted:#8b8175;
  --red:#d2382e; --red-deep:#a5271e; --red-tint:#fbeeec;
  --green:#1f8a5b; --green-deep:#176a45; --green-tint:#eaf5ef;
  --slate:#5f6b73; --teal:#3f6f8f; --amber:#c98a1e;
  --disp:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 14px 34px -22px rgba(27,24,21,.4);
  --r:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--disp);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;padding-bottom:70px;border-top:4px solid var(--red)}
.mono{font-family:var(--mono)} .small{font-size:12px} .muted{color:var(--muted)}
button,input,select,textarea{font-family:inherit}
a{color:var(--red-deep)}

/* ---------- header ---------- */
.wd-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  padding:15px 28px;border-bottom:1.5px solid var(--ink);background:var(--panel);position:sticky;top:0;z-index:5}
.wd-brand{display:flex;align-items:center;gap:12px}
.wd-mark{font-size:28px;line-height:1}
.wd-title{font-weight:700;font-size:19px;letter-spacing:-.02em}
.wd-title .wd-r{color:var(--red)}
.wd-topright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.wd-hi{font-size:13.5px;font-weight:600}
.wd-hi .wd-hub{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:400;margin-left:6px}
.wd-sync{font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;border:1.3px solid var(--line);white-space:nowrap}
.wd-sync.ok{color:var(--green-deep);border-color:var(--green);background:var(--green-tint)}
.wd-sync.err{color:var(--red-deep);border-color:var(--red);background:var(--red-tint)}
.wd-sync.off{color:#7a5a10;border-color:var(--amber);background:#fdf3e0}
.wd-sync.init{color:var(--muted)}
.wd-roleswitch{display:flex;border:1.5px solid var(--ink);border-radius:30px;overflow:hidden;padding:3px;gap:3px;background:var(--panel)}
.wd-roleswitch button{font-weight:600;font-size:13px;padding:7px 16px;background:transparent;border:0;cursor:pointer;color:var(--ink);border-radius:30px;transition:background .1s}
.wd-roleswitch button.on{background:var(--ink);color:#fff}
.wd-out{font-size:12.5px;font-weight:600;background:none;border:1.4px solid var(--line);border-radius:20px;padding:7px 14px;cursor:pointer;color:var(--muted)}
.wd-out:hover{border-color:var(--ink);color:var(--ink)}
.wd-pvbtn{margin-right:6px}
.wd-pvbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff4e0;border:1.5px solid #c98a1e;color:#6b4a0f;padding:10px 14px;border-radius:12px;font-size:13px;margin:0 0 16px}
.wd-pvbar .sp{flex:1}
.wd-pvbar button{font-weight:600;font-size:12.5px;background:#1b1815;color:#fff;border:0;border-radius:20px;padding:7px 14px;cursor:pointer}
.wd-pvmodal{position:fixed;inset:0;background:rgba(27,24,21,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.wd-pvcard{background:var(--panel,#fff);border-radius:16px;padding:22px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.wd-pvcard h3{margin:0 0 6px;font-size:18px}
.wd-pvcard p{margin:0 0 14px;font-size:13px;color:var(--muted)}
.wd-pvcard select{width:100%;padding:10px;border-radius:10px;border:1.4px solid var(--line);font-size:14px;margin-bottom:14px;background:#fff}
.wd-pvrow{display:flex;gap:8px;justify-content:flex-end}
.wd-pvgo{font-weight:600;font-size:13px;background:#1b1815;color:#fff;border:0;border-radius:20px;padding:9px 16px;cursor:pointer}
.wd-pvtoast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1815;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* ---------- layout ---------- */
.wd-grid{display:grid;grid-template-columns:1fr 330px;gap:26px;max-width:1140px;margin:32px auto;padding:0 24px}
@media(max-width:880px){.wd-grid{grid-template-columns:1fr}}
.wd-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}
.wd-eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
.wd-h{font-size:27px;font-weight:700;letter-spacing:-.025em;line-height:1.08;margin:0 0 9px}
.wd-lede{color:#5d554b;font-size:14px;line-height:1.55;margin:0 0 22px;max-width:48ch}
.wd-divider{border:0;border-top:1px solid var(--line-soft);margin:22px 0}

/* ---------- form ---------- */
.wd-field{display:block;margin-bottom:16px}
.wd-label{display:block;font-size:12px;font-weight:600;letter-spacing:.02em;margin-bottom:6px}
.wd-hint{display:block;font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}
.wd-field input,.wd-field select,.wd-field textarea,.wd-search,.wd-vadd input,.wd-msgadd input,.wd-noteadd input,.wd-detail input,.wd-vlist input,.wd-vlist select{
  width:100%;font-size:14px;padding:10px 12px;border:1.4px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.wd-field input.mono,.wd-detail input.mono,.wd-vlist input.mono{font-family:var(--mono)}
.wd-field input:focus,.wd-field select:focus,.wd-field textarea:focus,.wd-search:focus,.wd-msgadd input:focus,.wd-noteadd input:focus{outline:2px solid var(--red);border-color:var(--red)}
.wd-field textarea{resize:vertical;line-height:1.45}
.wd-locked{background:var(--paper) !important;color:var(--muted);font-weight:600}
.wd-row2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:520px){.wd-row2{grid-template-columns:1fr}}

.wd-attach{display:flex;align-items:center;gap:10px;margin-top:4px}
.wd-attachbtn{font-size:13px;font-weight:600;padding:11px 18px;border:1.4px dashed var(--line);background:#fff;border-radius:10px;cursor:pointer;color:var(--ink)}
.wd-attachbtn:hover{border-color:var(--red);color:var(--red-deep)}
.wd-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.wd-thumb{position:relative;width:76px;height:76px;border-radius:9px;overflow:hidden;border:1.4px solid var(--line)}
.wd-thumb img{width:100%;height:100%;object-fit:cover}
.wd-thumb button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(27,24,21,.78);color:#fff;font-size:13px;line-height:1;cursor:pointer}

.wd-primary{font-weight:700;font-size:15px;letter-spacing:.01em;background:var(--red);color:#fff;border:0;border-radius:11px;
  padding:14px 22px;cursor:pointer;width:100%;box-shadow:0 8px 18px -8px var(--red-deep);transition:transform .07s,box-shadow .07s}
.wd-primary:hover{transform:translateY(-1px);box-shadow:0 12px 22px -8px var(--red-deep)}
.wd-primary:disabled{background:#cfc7b8;box-shadow:none;cursor:not-allowed}
.wd-req{font-size:11px;color:var(--red-deep);margin-top:9px}
.wd-toast{background:var(--green-tint);border:1.4px solid var(--green);color:var(--green-deep);padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;font-weight:500}
.wd-warn{background:var(--red-tint);border:1.4px solid var(--red);color:var(--red-deep);padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:16px}

/* ---------- recent list ---------- */
.wd-side .wd-sidenote{font-size:13px;color:var(--muted);line-height:1.5}
.wd-sidefilters{display:flex;gap:7px;margin:2px 0 12px;align-items:stretch}
.wd-sidefilters select{flex:1;min-width:0;font-size:12.5px;padding:7px 9px;border:1.4px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-family:inherit}
.wd-hideres{font-size:11.5px;font-weight:600;white-space:nowrap;background:none;border:1.4px solid var(--line);border-radius:20px;padding:6px 11px;cursor:pointer;color:var(--muted)}
.wd-hideres:hover{border-color:var(--ink);color:var(--ink)}
.wd-hideres.on{background:var(--ink);border-color:var(--ink);color:#fff}
.wd-mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wd-mini button{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line-soft);padding:13px 6px;cursor:pointer;border-radius:8px;transition:background .1s;font-family:inherit;color:var(--ink)}
.wd-mini li:first-child button{border-top:0}
.wd-mini button:hover{background:#faf7f0}
.wd-minitop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wd-minimeta{font-size:12px;color:var(--muted);margin-top:4px}
.wd-msgcount{font-size:11px;font-weight:600;color:var(--teal);margin-left:auto}
.wd-pill{font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;white-space:nowrap;border:1.3px solid var(--p);color:var(--p);background:color-mix(in srgb,var(--p) 9%,#fff)}

/* ---------- manager board ---------- */
.wd-mgr{max-width:1180px;margin:30px auto;padding:0 24px}
.wd-boardhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.wd-archtoggle{background:none;border:1.4px solid var(--line);border-radius:20px;padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.wd-archtoggle:hover{border-color:var(--ink);color:var(--ink)}
.wd-archtoggle.on{background:var(--ink);border-color:var(--ink);color:#fff}
.wd-archtoggle .wd-dot{display:inline-block;min-width:18px;padding:1px 6px;border-radius:10px;background:var(--red);color:#fff;font-size:10.5px;margin-left:6px;text-align:center}
.wd-inboxbar{display:flex;gap:7px;margin:0 0 12px;flex-wrap:wrap}
.wd-inboxbar button{font-size:12.5px;font-weight:600;padding:7px 13px;border:1.4px solid var(--line);background:#fff;border-radius:20px;cursor:pointer;color:var(--muted)}
.wd-inboxbar button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.wd-inbox{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow)}
.wd-ibx{width:100%;text-align:left;background:var(--panel);border:0;border-top:1px solid var(--line-soft);padding:14px 18px;cursor:pointer;font-family:inherit;color:var(--ink);display:grid;grid-template-columns:150px 1fr 150px 24px;gap:14px;align-items:center}
.wd-ibx:first-child{border-top:0}
.wd-ibx:hover{background:#faf7f0}
.wd-ibx.unread{background:#fff8f7}
.wd-ibx.unread:hover{background:#fdf1ef}
.wd-ibx-who{font-size:12.5px;font-weight:600;margin-bottom:2px}
.wd-ibx-prev{font-size:13px;color:#5d554b;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.wd-ibx-prev b{color:var(--ink);font-weight:600}
.wd-ibx-when{font-size:12px;color:var(--muted);text-align:right}
.wd-ibx-tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--red);margin-top:4px;display:block}
@media(max-width:760px){.wd-ibx{grid-template-columns:1fr;gap:6px}.wd-ibx-when{text-align:left}}
.wd-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.wd-dangerbtn{margin-left:auto;font-size:12.5px;font-weight:600;padding:9px 14px;border:1.4px solid var(--red);background:#fff;color:var(--red-deep);border-radius:10px;cursor:pointer}
.wd-dangerbtn:hover{background:var(--red);color:#fff}
.wd-archnote{font-size:12px;color:var(--muted);margin-top:10px;background:var(--panel);border:1px dashed var(--line);border-radius:9px;padding:9px 12px}
.wd-stats{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:18px;align-items:stretch}
.wd-stat{flex:1;min-width:124px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--p);
  border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;transition:box-shadow .1s,transform .07s}
.wd-stat:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.wd-stat.on{border-color:var(--ink);box-shadow:var(--shadow)}
.wd-statn{font-size:27px;font-weight:700;line-height:1}
.wd-stats-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:4px}
.wd-settings{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:0 22px;font-weight:600;font-size:13px;cursor:pointer}

.wd-filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.wd-search{flex:1;min-width:200px}
.wd-filters select{padding:10px 12px;border:1.4px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
.wd-filters select.wd-hubsel.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:600}
.wd-clear{background:none;border:1.3px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12px;cursor:pointer}

.wd-table{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow)}
.wd-thead,.wd-tr{display:grid;grid-template-columns:118px 1.2fr 1.3fr 2fr 132px 24px;gap:12px;align-items:center;padding:13px 18px}
.wd-thead{background:var(--ink);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.wd-tr{width:100%;text-align:left;background:var(--panel);border:0;border-top:1px solid var(--line-soft);cursor:pointer;font-size:13px;color:var(--ink)}
.wd-tr:hover{background:#faf7f0}
.wd-clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;color:#5d554b;line-height:1.4}
.wd-chev{font-size:20px;color:var(--muted)}
@media(max-width:760px){.wd-thead{display:none}.wd-tr{grid-template-columns:1fr 1fr;gap:6px}.wd-clip{grid-column:1/-1}}

.wd-empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}

/* ---------- drawer ---------- */
.wd-overlay{position:fixed;inset:0;background:rgba(27,24,21,.45);display:flex;justify-content:flex-end;z-index:20}
.wd-drawer{width:min(570px,100%);height:100%;background:var(--paper);overflow-y:auto;padding:26px 26px 80px;border-left:1.5px solid var(--ink)}
.wd-dhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.wd-dhead h3{margin:3px 0 0;font-size:21px;letter-spacing:-.02em}
.wd-x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.wd-dstatus{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.wd-stepbtn,.wd-rm{font-size:12px;font-weight:600;padding:7px 12px;border:1.4px solid var(--line);background:#fff;border-radius:20px;cursor:pointer;color:var(--ink)}
.wd-stepbtn.on{color:#fff;border-color:transparent}
.wd-dgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.wd-detail{background:var(--panel);padding:11px 14px}
.wd-detail.block{grid-column:1/-1;display:block;margin-bottom:14px;border:1px solid var(--line);border-radius:12px}
.wd-dk{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:3px}
.wd-dv{font-size:14px;font-weight:500}
.wd-issue{font-size:13.5px;line-height:1.55;white-space:pre-wrap;font-weight:400}
.wd-part{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:18px}
.wd-known{font-size:13px;background:var(--green-tint);border:1px solid var(--green);padding:9px 11px;border-radius:9px;margin-bottom:10px}
.wd-sidenote{font-size:12.5px;color:var(--muted);line-height:1.5}
.wd-partbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.wd-ghost{font-size:12.5px;font-weight:600;padding:9px 14px;border:1.4px solid var(--ink);background:#fff;border-radius:10px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-block}
.wd-ghost:hover{background:var(--ink);color:#fff}
.wd-photos{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.wd-photos a{display:block;width:94px;height:94px;border-radius:10px;overflow:hidden;border:1.4px solid var(--line)}
.wd-photos img{width:100%;height:100%;object-fit:cover}

/* ---------- messages ---------- */
.wd-msgs{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:18px}
.wd-msglist{display:flex;flex-direction:column;gap:9px;margin-bottom:4px;max-height:320px;overflow-y:auto}
.wd-msg{max-width:86%;padding:9px 13px;border-radius:13px;font-size:13px;line-height:1.45}
.wd-msg .wd-msgmeta{display:block;font-size:10.5px;color:var(--muted);margin-top:4px}
.wd-msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.wd-msg.me .wd-msgmeta{color:rgba(255,255,255,.6)}
.wd-msg.them{align-self:flex-start;background:#fff;border:1.3px solid var(--line);border-bottom-left-radius:4px}
.wd-msgadd{display:flex;gap:8px;margin-top:11px}
.wd-msgadd button,.wd-noteadd button,.wd-vadd button{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:0 17px;font-weight:600;font-size:13px;cursor:pointer}
.wd-msgadd button:disabled{background:#cfc7b8;cursor:not-allowed}
.wd-msgclip{background:#fff !important;color:var(--ink) !important;border:1.4px dashed var(--line) !important;padding:0 13px !important;font-size:16px !important;line-height:1}
.wd-msgclip:hover{border-color:var(--red) !important;color:var(--red-deep) !important}
.wd-msgpend{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.wd-msgpend .wd-thumb{width:58px;height:58px}
.wd-msgpdf{display:inline-flex;align-items:center;gap:7px;font-size:12px;background:#fff;border:1.4px solid var(--line);border-radius:9px;padding:6px 9px;max-width:100%}
.wd-msgpdf span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.wd-msgpdf button{background:none;border:0;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0}
.wd-msgpend-hint{font-size:11px;color:var(--muted);margin-top:6px}
.wd-msgatt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.wd-msgatt a.wd-msgimg{display:block;width:120px;height:120px;border-radius:9px;overflow:hidden;border:1.4px solid var(--line);background:#fff}
.wd-msgatt a.wd-msgimg img{width:100%;height:100%;object-fit:cover;display:block}
.wd-msgatt .wd-msgfile{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:#fff;color:var(--ink);border:1.4px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer;text-decoration:none;font-family:inherit;max-width:100%}
.wd-msgatt .wd-msgfile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.wd-msgatt .wd-msgfile:hover{border-color:var(--red);color:var(--red-deep)}
.wd-msgatt .wd-msgfile:disabled{opacity:.7;cursor:progress}
.wd-msg.me .wd-msgatt .wd-msgfile,.wd-msg.me .wd-msgatt a.wd-msgimg{border-color:rgba(255,255,255,.35)}

.wd-notes{border-top:1px solid var(--line);padding-top:15px}
.wd-note{font-size:13px;padding:8px 0;border-bottom:1px dotted var(--line);line-height:1.4}
.wd-noteadd{display:flex;gap:8px;margin-top:11px}
.wd-vlist{list-style:none;padding:0;margin:6px 0 12px}
.wd-vlist li{padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wd-rm{padding:4px 10px;margin-left:auto}
.wd-vadd{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.wd-vadd.one{grid-template-columns:1fr auto}
.wd-vadd.staff{grid-template-columns:1.4fr 1fr .8fr 1fr auto}
@media(max-width:560px){.wd-vadd,.wd-vadd.staff{grid-template-columns:1fr 1fr}.wd-vadd button{padding:10px 17px}.wd-drawer{padding:20px 16px 80px}.wd-top{padding:12px 16px}.wd-mgr,.wd-grid{padding:0 16px}.wd-card{padding:22px 18px}}
.wd-settings{min-height:46px}
.wd-switch{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;margin-top:4px}
.wd-switch input{width:18px;height:18px;accent-color:var(--red)}
/* ---------- demo pill + lightbox ---------- */

<script>

<input type="file" id="hiddenFile" accept="image/*" multiple style="display:none" />
<input type="file" id="hiddenVideo" accept="video/*" multiple style="display:none" />
<input type="file" id="hiddenDoc" accept="application/pdf,.pdf" multiple style="display:none" />
<input type="file" id="hiddenMsgFile" accept="image/*,application/pdf,.pdf" multiple style="display:none" />

<script>
/* Warranty Desk — demo build. All data is invented and lives in memory only. */
var APP_VER="3.2";
var VIDEO_MAX=60*1024*1024;  /* per-video cap */
var DOC_MAX=20*1024*1024;    /* per-PDF cap */
var MEDIA={};                /* media base -> Blob (attachments stay in this tab) */
function mediaBlob(base){return MEDIA[base]?Promise.resolve(MEDIA[base]):Promise.reject(new Error("missing"));}
/* Asset ID from the fleet system: letters, digits and dashes */
function assetIdOk(v){v=(v||"").trim().toUpperCase();return /^[A-Z0-9][A-Z0-9-]{3,39}$/.test(v)?v:"";}
function demoLink(){pvToast("Links are disabled in the demo");return false;}

var sync={
  status:"ok",
  uploadMedia:function(caseId,tag,file,onProgress){
    var base=caseId+"/"+tag+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,6);
    MEDIA[base]=file;
    if(onProgress)onProgress(0,1);
    return Promise.resolve({base:base,chunks:1,type:file.type,name:file.name||tag,size:file.size});
  },
  uploadPhoto:function(caseId,idx,dataUrl){return Promise.resolve(dataUrl);}
};

function syncBadge(){
  var b=document.getElementById("wd-sync");
  if(!b)return;
  b.className="wd-sync "+sync.status;
  b.textContent=sync.status==="ok"?"● Saved (demo)"
   :sync.status==="err"?"● Sync error — retrying"
   :sync.status==="off"?"● Local only — not shared"
   :"● Syncing…";
}

var CASES={};      /* id -> case */
var CONFIG=null;   /* desk settings */
function clone(o){return JSON.parse(JSON.stringify(o));}
var store = {
  getCases:function(){var out=[];for(var id in CASES)out.push(clone(CASES[id]));out.sort(function(a,b){return b.created-a.created;});return out;},
  saveCase:function(c){CASES[c.id]=clone(c);return true;},
  deleteCase:function(id){delete CASES[id];},
  getConfig:function(){
    var c=CONFIG?clone(CONFIG):{};
    if(!c.vendors)c.vendors=DEFAULT_VENDORS.slice();
    if(!c.staff)c.staff=[];
    if(!c.admin)c.admin={name:"Demo Manager"};
    if(!c.admins)c.admins=[];
    if(c.chatChannel==null)c.chatChannel="#warranty-desk";
    if(!c.partsMap)c.partsMap={};
    if(!c.hubB2B)c.hubB2B={};
    HUBS.forEach(function(h){if(c.hubB2B[h]==null)c.hubB2B[h]=HUB_B2B[h]||"";});
    return c;
  },
  saveConfig:function(c){
    /* new PINs are never kept: the account is just marked as having one */
    [c.admin].concat(c.admins||[],c.staff||[]).forEach(function(a){if(a&&a.pin){a.pinSet=true;}});
    CONFIG=cleanConfig(c);
  }
};

var HUBS=["Pluto","Vega","Orion","Atlas","Nova"];
var HUB_B2B={Pluto:"PLU",Vega:"PLU",Orion:"ORN",Atlas:"ORN",Nova:"NVA"};
var DEFAULT_VENDORS=[
  {name:"SRAM",portal:"demo"},
  {name:"Specialized",portal:"demo"},
  {name:"Trek",portal:"demo"},
  {name:"Rad Power Bikes",portal:"demo"},
  {name:"Bosch eBike",portal:"demo"},
  {name:"Shimano",portal:"demo"},
  {name:"Brose",portal:"demo"},
  {name:"Fox",portal:"demo"}
];
var MIN_PIN=6;
function cleanConfig(c){
  var o=JSON.parse(JSON.stringify(c||{}));
  if(o.admin)delete o.admin.pin;
  (o.admins||[]).forEach(function(s){delete s.pin;});
  (o.staff||[]).forEach(function(s){delete s.pin;});
  return o;
}
function pinOk(p){return new RegExp("^\\d{"+MIN_PIN+",12}$").test(p);}
var PART_CATEGORIES=["Accessory","Axle","Battery","Bottom Bracket","Cable brake lever","Cassette","Chain","Chain - Connectors","Crank","Derailleur - Front","Derailleur - Rear","Disc Brake","E-Drive","Electric product","Fork","Frame","Handlebar","Hub","Internal Gear Hub","Motor","Motor harness","Pedal","Power Meter","Rear Shock","Rim","Rotor","Seatpost - Fixed","Seatpost - Telescopic","Shifter","Shifter-brake","Speed sensor","Stem","Susp remote","Wheel","Other"];
var STATUSES=["New","Reviewing","Filed with OEM","Return to vendor","Parts ordered","Resolved"];
var TONE={"New":"#d2382e","Reviewing":"#5f6b73","Filed with OEM":"#3f6f8f","Return to vendor":"#7a4fa3","Parts ordered":"#c98a1e","Resolved":"#1f8a5b"};

function uid(){return "WC"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();}
function fmt(ts){return new Date(ts).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function el(id){return document.getElementById(id);}
function photosOf(c){return Array.isArray(c.photos)?c.photos:((c.photos||"").split(",").map(function(s){return s.trim();}).filter(Boolean));}
function firstName(n){return (n||"").split(" ")[0];}
function typing(){var a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA");}

var state={open:null,settings:false,edit:false,q:"",status:"All",vendor:"All",hub:"All",showArchived:false,showMessages:false,inboxFilter:"all",leadStatus:"All",leadHideResolved:false,toast:null,warn:null,filing:false,clearForm:false};
var pendingPhotos=[];
var pendingVideos=[];
var pendingDocs=[];
var videoURLs={};   /* caseId/idx -> object URL of an already-downloaded video */
var docURLs={};     /* caseId/idx -> object URL of an already-downloaded PDF report */
var labelURLs={};   /* caseId/idx -> object URL of an already-downloaded return label PDF */
var msgFileURLs={}; /* media base -> object URL of an already-downloaded message PDF */
var pendingMsgFiles=[]; /* attachments queued on the open case's message box: {kind:"photo",dataUrl} | {kind:"pdf",file} */
var msgSending=false;
var DEMO_ADMIN={id:"admin",name:"Demo Manager",hub:"",role:"admin"};
var session=DEMO_ADMIN;
/* ---- "View as" a Service Lead ----
   Switches the screen to what a hub Service Lead sees. In the demo everything still
   works (filing, replies), all in memory. */
var previewAs=null;      /* {id,name,hub,role:"lead",preview:true} while previewing */
var realSession=null;    /* the admin's own session, restored on exit */
function inPreview(){return !!previewAs;}
function pvToast(msg){
  var t=document.querySelector(".wd-pvtoast");if(t)t.remove();
  t=document.createElement("div");t.className="wd-pvtoast";t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){if(t.parentNode)t.remove();},3500);
}
function openPreview(){
  if(!session||session.role!=="admin"||previewAs)return;
  var cfg=store.getConfig();
  var staff=(cfg.staff||[]).filter(function(s){return s&&s.name;}).slice().sort(function(a,b){var d=HUBS.indexOf(a.hub)-HUBS.indexOf(b.hub);return d||a.name.localeCompare(b.name);});
  var opts=staff.map(function(s,i){return '<option value="s'+i+'">'+esc(s.name)+' · '+esc(s.hub)+' hub</option>';}).join("")
    +'<optgroup label="Any Service Lead at a hub">'+HUBS.map(function(h){return '<option value="h'+h+'">Service Lead · '+h+' hub</option>';}).join("")+'</optgroup>';
  var m=document.createElement("div");m.className="wd-pvmodal";
  m.innerHTML='<div class="wd-pvcard"><h3>&#128065; View as a Service Lead</h3>'
    +'<p>See Warranty Desk the way a hub Service Lead does: their hub&#39;s cases, the submit form, and their messages. In the demo you can file cases and reply from here too.</p>'
    +'<select id="pv_pick">'+opts+'</select>'
    +'<div class="wd-pvrow"><button class="wd-out" id="pv_cancel">Cancel</button><button class="wd-pvgo" id="pv_go">Switch view</button></div></div>';
  document.body.appendChild(m);
  m.addEventListener("click",function(e){if(e.target===m)m.remove();});
  el("pv_cancel").onclick=function(){m.remove();};
  el("pv_go").onclick=function(){
    var v=el("pv_pick").value,who;
    if(v.charAt(0)==="s"){var s=staff[Number(v.slice(1))];who={id:"preview",name:s.name,hub:s.hub,role:"lead",preview:true};}
    else who={id:"preview",name:"Service Lead",hub:v.slice(1),role:"lead",preview:true};
    m.remove();
    realSession=session;previewAs=who;session=who;
    state.open=null;state.settings=false;state.edit=false;state.toast=null;state.warn=null;state.leadStatus="All";state.leadHideResolved=false;
    pendingPhotos=[];pendingVideos=[];pendingDocs=[];pendingMsgFiles=[];state.clearForm=true;
    window.scrollTo(0,0);render();
  };
}
function exitPreview(){
  if(!previewAs)return;
  session=realSession||DEMO_ADMIN;previewAs=null;realSession=null;
  state.open=null;state.toast=null;state.warn=null;state.clearForm=true;
  pendingPhotos=[];pendingVideos=[];pendingDocs=[];pendingMsgFiles=[];
  window.scrollTo(0,0);render();
}
var DEEP_CASE=null;
try{DEEP_CASE=new URLSearchParams(location.search).get("case")||null;}catch(e){}

/* ============ render root ============ */
function render(){
  /* keep whatever the user has typed: background syncs re-render this whole
     page, and without this every field would be wiped mid-entry */
  var keep={};
  document.querySelectorAll("#app input[id],#app select[id],#app textarea[id],.wd-overlay input[id],.wd-overlay select[id],.wd-overlay textarea[id]").forEach(function(n){keep[n.id]=n.value;});
  if(state.clearForm){Object.keys(keep).forEach(function(id){if(id.indexOf("f_")===0)delete keep[id];});state.clearForm=false;}
  document.querySelectorAll(".wd-overlay").forEach(function(n){n.remove();});
  var cfg=store.getConfig();
  /* Demo opens in the Service Lead view first; the manager view is one click away */
  if(!window.__wdStarted){window.__wdStarted=true;
    var firstLead=(cfg.staff||[]).filter(function(s){return s&&s.name&&s.hub==="Pluto";})[0]||(cfg.staff||[]).filter(function(s){return s&&s.name;})[0];
    var who=firstLead?{id:"preview",name:firstLead.name,hub:firstLead.hub,role:"lead",preview:true}:{id:"preview",name:"Service Lead",hub:"Pluto",role:"lead",preview:true};
    realSession=DEMO_ADMIN;previewAs=who;session=who;}
  var isAdmin=session.role==="admin";

  var html=''
   +'<header class="wd-top">'
   +'<div class="wd-brand"><span class="wd-mark">🐼</span>'
   +'<div class="wd-title"><span class="wd-r">Warranty</span> Desk</div></div>'
   +'<div class="wd-topright">'
   +'<span id="wd-sync" class="wd-sync"></span>'
   +'<span class="wd-hi">Hi, '+esc(isAdmin?session.name:firstName(session.name))+(isAdmin?'':'<span class="wd-hub">'+esc(session.hub)+' hub</span>')+'</span>'
   +(isAdmin?'<button class="wd-out wd-pvbtn" onclick="openPreview()" title="See what a Service Lead sees">&#128065; View as Service Lead</button>':'')
   +(inPreview()?'<button class="wd-out wd-pvbtn" onclick="exitPreview()">&#128065; Preview as Warranty &amp; Parts Manager</button>':'')
   +'</div></header>';
  if(inPreview())html+='<div class="wd-pvbar">&#128065;<span>Viewing as <b>'+esc(session.name)+'</b>, Service Lead at <b>'+esc(session.hub)+' hub</b>. This is what they see.</span><span class="sp"></span><button onclick="exitPreview()">Preview as Warranty &amp; Parts Manager</button></div>';

  html+=isAdmin?managerView(cfg):leadView(cfg);
  html+='<div class="wd-foot">Demo build: every case, person, serial and claim number here is invented, and changes live only in this tab. Where the real desk sends a team chat notification, the demo shows a small toast instead.'
   +' <span class="mono">v'+APP_VER+'</span></div>';
  el("app").innerHTML=html;
  syncBadge();
  /* ?case=WC… links open that case straight away */
  if(DEEP_CASE&&!state.open){
    var dc=store.getCases().filter(function(x){return x.id===DEEP_CASE;})[0];
    if(dc){state.open=DEEP_CASE;DEEP_CASE=null;try{history.replaceState(null,"",location.pathname);}catch(e){}}
  }
  if(state.open)drawer(cfg);
  if(state.settings&&isAdmin)settingsPanel(cfg);
  Object.keys(keep).forEach(function(id){var n=el(id);if(n&&n.value!==keep[id])n.value=keep[id];});
  if(!isAdmin){renderThumbs();renderVids();renderDocs();if(!el("f_account")||!el("f_account").value)syncB2B();}
}

/* ============ intake (Service Lead + Admin) ============ */
function visibleCases(){
  var cases=store.getCases().filter(function(c){return !c.archived;});
  if(session.role==="admin")return cases;
  return cases.filter(function(c){return c.hub===session.hub;});
}

function leadView(cfg){
  var cases=visibleCases();
  var isAdmin=session.role==="admin";
  var shownCases=cases.filter(function(c){
    if(state.leadHideResolved&&c.status==="Resolved")return false;
    if(state.leadStatus!=="All"&&c.status!==state.leadStatus)return false;
    return true;
  });
  var vopts=cfg.vendors.map(function(v){return '<option>'+esc(v.name)+'</option>';}).join("");
  var copts='<option value="">Select…</option>'+PART_CATEGORIES.map(function(c){return '<option>'+esc(c)+'</option>';}).join("");
  var hubField=isAdmin
    ? field("Hub",'<select id="f_hub" onchange="syncB2B()">'+HUBS.map(function(h){return '<option>'+h+'</option>';}).join("")+'</select>')
    : field("Hub",'<input id="f_hub" class="wd-locked" value="'+esc(session.hub)+'" readonly />',"Set from your account. Cases you file belong to your hub.");
  var recent=shownCases.slice(0,8).map(function(c){
    var msgs=(c.messages||[]).length;
    return '<li><button onclick="openCase(\''+c.id+'\')">'
     +'<span class="wd-minitop"><span class="mono small">'+c.id+'</span>'
     +'<span class="wd-pill" style="--p:'+TONE[c.status]+'">'+c.status+'</span>'
     +(msgs?'<span class="wd-msgcount">💬 '+msgs+'</span>':'')
     +'</span>'
     +'<div class="wd-minimeta">'+esc(c.vendor)+' · '+esc(c.hub)+' · <span class="mono">'+esc(c.serial)+'</span> · '+fmt(c.created)+'</div>'
     +'</button></li>';
  }).join("");

  return '<div class="wd-grid">'
   +'<section class="wd-card">'
   +'<div class="wd-eyebrow">Submit a warranty</div>'
   +'<h2 class="wd-h">Hi '+esc(firstName(session.name))+', hand it off.</h2>'
   +'<p class="wd-lede">Fill this once and the Warranty &amp; Parts Manager takes it from here, files with the manufacturer and stocks the part for your hub.</p>'
   +(state.toast?'<div class="wd-toast">Case <b>'+state.toast+'</b> filed. The warranty desk has been pinged (demo).</div>':'')
   +(state.warn?'<div class="wd-warn">'+state.warn+'</div>':'')
   +'<div class="wd-row2">'
   +field("Manufacturer (OEM)",'<select id="f_vendor">'+vopts+'</select>')
   +hubField
   +'</div>'
   +'<div class="wd-row2">'
   +field("Bike condition",'<select id="f_condition"><option value="">Select…</option><option>New</option><option>Used</option></select>')
   +field("B2B account",'<input id="f_account" placeholder="Auto fills from hub" />',"Auto selected from the hub. Override if this case belongs to a different account.")
   +'</div>'
   +'<div class="wd-row2">'
   +field("Frame serial number",'<input id="f_serial" class="mono" placeholder="SPZ24A000000X" />',"Use the serial number stamped on the bike frame — not a motor, battery, or part serial. Stored exactly as typed.")
   +field("Work order #",'<input id="f_wo" class="mono" placeholder="e.g. 5120" />',"The WO this claim came out of, so anyone can cross reference it.")
   +'</div>'
   +field("Asset ID",'<input id="f_asset" class="mono" placeholder="e.g. AST-30418" />',"The asset ID from the fleet system, so notifications point straight at this asset.")
   +'<div class="wd-row2">'
   +field("Part category",'<select id="f_category">'+copts+'</select>')
   +field("Part number / SKU",'<input id="f_sku" class="mono" placeholder="BX-0000-00" />',"Optional, if you have it")
   +'</div>'
   +field("What is wrong?",'<textarea id="f_issue" rows="4" placeholder="What failed, what you tried, what you are requesting."></textarea>')
   +'<div class="wd-field"><span class="wd-label">Photos — attach all three</span>'
   +'<span class="wd-hint" style="margin-top:0;margin-bottom:8px">We need a clear shot of each: <b>1.</b> the frame serial number, <b>2.</b> the damaged part up close, <b>3.</b> the whole bike.</span>'
   +'<div class="wd-attach"><button type="button" class="wd-attachbtn" onclick="pickPhotos()">📎 Attach photos</button></div>'
   +'<div class="wd-thumbs" id="f_thumbs"></div>'
   +'<span class="wd-hint">Snap from your phone. The Warranty Manager sees every photo on the case.</span></div>'
   +'<div class="wd-field"><span class="wd-label">Video (optional)</span>'
   +'<span class="wd-hint" style="margin-top:0;margin-bottom:8px">A short clip helps for noises, intermittent faults, or anything a photo can&#39;t show. Up to '+Math.round(VIDEO_MAX/1048576)+'MB per video — trim long recordings first.</span>'
   +'<div class="wd-attach"><button type="button" class="wd-attachbtn" onclick="pickVideos()">🎥 Attach video</button></div>'
   +'<div id="f_vids"></div></div>'
   +'<div class="wd-field"><span class="wd-label">Diagnostic report (PDF, optional)</span>'
   +'<span class="wd-hint" style="margin-top:0;margin-bottom:8px">Attach the OEM diagnostic report — Bosch, Shimano, Brose, etc. PDF only, up to '+Math.round(DOC_MAX/1048576)+'MB each.</span>'
   +'<div class="wd-attach"><button type="button" class="wd-attachbtn" onclick="pickDocs()">📄 Attach PDF</button></div>'
   +'<div id="f_docs"></div></div>'
   +'<button class="wd-primary" id="f_submit" onclick="submitCase()"'+(state.filing?' disabled':'')+'>'+(state.filing?'Filing — uploading photos…':'File warranty case')+'</button>'
   +'<div class="wd-req" id="f_err" style="display:none">Manufacturer, hub, bike condition, frame serial, asset ID, part category and issue are required.</div>'
   +'<div class="wd-req" id="f_err_asset" style="display:none">That doesn&#39;t look like an asset ID. Use letters, digits and dashes, e.g. AST-30418.</div>'
   +'</section>'
   +'<aside class="wd-card wd-side">'
   +'<div class="wd-eyebrow">'+(isAdmin?'All recent cases':esc(session.hub)+' recent cases')+'</div>'
   +'<div class="wd-sidefilters">'
   +'<select onchange="setLeadStatus(this.value)">'
   +'<option value="All"'+(state.leadStatus==="All"?' selected':'')+'>All statuses</option>'
   +STATUSES.map(function(s){return '<option'+(state.leadStatus===s?' selected':'')+'>'+s+'</option>';}).join("")
   +'</select>'
   +'<button class="wd-hideres'+(state.leadHideResolved?' on':'')+'" onclick="toggleLeadHideResolved()" title="Hide cases that are already resolved">'+(state.leadHideResolved?'✓ ':'')+'Hide resolved</button>'
   +'</div>'
   +(recent?'<ul class="wd-mini">'+recent+'</ul>'
     :(cases.length?'<div class="wd-sidenote">No cases match this filter.</div>'
       :'<div class="wd-sidenote">Nothing yet. Filed cases land here and on the manager board.</div>'))
   +'</aside></div>';
}
function syncB2B(){var h=el("f_hub"),a=el("f_account");if(!h||!a)return;var m=store.getConfig().hubB2B||{};a.value=m[h.value]||"";}

/* ---- photos ---- */
function pickPhotos(){var inp=el("hiddenFile");inp.onchange=function(){var fs=inp.files;for(var i=0;i<fs.length;i++){(function(f){compress(f,function(d){if(d)pendingPhotos.push(d);renderThumbs();});})(fs[i]);}inp.value="";};inp.click();}
function compress(file,cb){var img=new Image();var url=URL.createObjectURL(file);img.onload=function(){var max=1100;var w=img.width,h=img.height;if(w>max){h=Math.round(h*max/w);w=max;}var cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);try{cb(cv.toDataURL("image/jpeg",0.7));}catch(e){cb(null);}};img.onerror=function(){URL.revokeObjectURL(url);};img.src=url;}
function renderThumbs(){var box=el("f_thumbs");if(!box)return;box.innerHTML=pendingPhotos.map(function(d,i){return '<div class="wd-thumb"><img src="'+d+'"><button type="button" onclick="removePhoto('+i+')">×</button></div>';}).join("");}
function removePhoto(i){pendingPhotos.splice(i,1);renderThumbs();}

/* ---- videos ---- */
function mb(n){return n?(Math.round(n/1048576*10)/10)+"MB":"";}
function pickVideos(){
  var inp=el("hiddenVideo");
  inp.onchange=function(){
    var fs=inp.files;
    for(var i=0;i<fs.length;i++){
      if(fs[i].size>VIDEO_MAX){
        state.warn="“"+esc(fs[i].name)+"” is "+mb(fs[i].size)+" — over the "+Math.round(VIDEO_MAX/1048576)+"MB limit. Trim the clip on your phone and attach it again.";
        render();
      }else{
        pendingVideos.push(fs[i]);
      }
    }
    inp.value="";renderVids();
  };
  inp.click();
}
function renderVids(){
  var box=el("f_vids");if(!box)return;
  box.innerHTML=pendingVideos.map(function(f,i){
    return '<div style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;background:#fff;border:1.4px solid var(--line);border-radius:10px;padding:8px 12px">🎬 <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(f.name)+'</span><span class="muted small mono">'+mb(f.size)+'</span><button type="button" class="wd-rm" onclick="removeVideo('+i+')">remove</button></div>';
  }).join("");

function removeVideo(i){pendingVideos.splice(i,1);renderVids();}

/* ---- PDF diagnostic reports ---- */
function isPdf(f){return f.type==="application/pdf"||/\.pdf$/i.test(f.name||"");}
function pickDocs(){
  var inp=el("hiddenDoc");
  inp.onchange=function(){
    var fs=inp.files;
    for(var i=0;i<fs.length;i++){
      if(!isPdf(fs[i])){
        state.warn="“"+esc(fs[i].name)+"” is not a PDF. Export the diagnostic report as PDF and attach that.";
        render();
      }else if(fs[i].size>DOC_MAX){
        state.warn="“"+esc(fs[i].name)+"” is "+mb(fs[i].size)+" — over the "+Math.round(DOC_MAX/1048576)+"MB limit for reports.";
        render();
      }else{
        pendingDocs.push(fs[i]);
      }
    }
    inp.value="";renderDocs();
  };
  inp.click();
}
function renderDocs(){
  var box=el("f_docs");if(!box)return;
  box.innerHTML=pendingDocs.map(function(f,i){
    return '<div style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;background:#fff;border:1.4px solid var(--line);border-radius:10px;padding:8px 12px">📄 <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(f.name)+'</span><span class="muted small mono">'+mb(f.size)+'</span><button type="button" class="wd-rm" onclick="removeDoc('+i+')">remove</button></div>';
  }).join("");
}
function removeDoc(i){pendingDocs.splice(i,1);renderDocs();}
function setFilingText(t){var b=el("f_submit");if(b)b.textContent=t;}

function submitCase(){
  if(state.filing)return;
  var get=function(id){return (el(id)?el(id).value:"").trim();};
  var data={vendor:get("f_vendor"),hub:get("f_hub"),condition:el("f_condition").value,account:get("f_account"),serial:get("f_serial").toUpperCase(),
    workorder:get("f_wo"),asset:assetIdOk(get("f_asset")),
    category:el("f_category").value,sku:get("f_sku"),issue:get("f_issue"),
    submitter:session.name,photos:pendingPhotos.slice()};
  el("f_err").style.display="none";el("f_err_asset").style.display="none";
  if(get("f_asset")&&!data.asset){el("f_err_asset").style.display="block";return;}
  if(!data.vendor||!data.hub||!data.condition||!data.serial||!data.asset||!data.category||!data.issue){el("f_err").style.display="block";return;}
  var rec=Object.assign({id:uid(),status:"New",created:Date.now(),modified:Date.now(),notes:[],messages:[]},data);

  if(rec.photos.length||pendingVideos.length||pendingDocs.length){
    state.filing=true;state.warn=null;render();
    Promise.all(rec.photos.map(function(p,i){return sync.uploadPhoto(rec.id,i,p);}))
     .then(function(urls){
        rec.photos=urls;
        var vids=pendingVideos.slice();
        var chain=Promise.resolve([]);
        vids.forEach(function(f,vi){
          chain=chain.then(function(metas){
            return sync.uploadMedia(rec.id,"v"+vi,f,function(ci,total){
              setFilingText("Filing — uploading video "+(vi+1)+"/"+vids.length+" ("+Math.round(ci/total*100)+"%)…");
            }).then(function(m){metas.push(m);return metas;});
          });
        });
        return chain;
     })
     .then(function(vmetas){
        if(vmetas.length)rec.videos=vmetas;
        var docs=pendingDocs.slice();
        var chain=Promise.resolve([]);
        docs.forEach(function(f,di){
          chain=chain.then(function(metas){
            return sync.uploadMedia(rec.id,"d"+di,f,function(ci,total){
              setFilingText("Filing — uploading report "+(di+1)+"/"+docs.length+" ("+Math.round(ci/total*100)+"%)…");
            }).then(function(m){metas.push(m);return metas;});
          });
        });
        return chain;
     })
     .then(function(dmetas){if(dmetas.length)rec.docs=dmetas;state.filing=false;finishSubmit(rec);})
     .catch(function(){
        state.filing=false;
        state.warn="Photos, video or report could not be attached, so the case was NOT filed. Check your connection and press File again — your form and attachments are still here.";
        render();
     });
  }else{
    finishSubmit(rec);
  }
}
function finishSubmit(rec){
  var ok=store.saveCase(rec);
  if(!ok){state.warn="That case could not be saved. Remove a photo or two and file again.";render();return;}
  notify("new_case",rec);
  pendingPhotos=[];pendingVideos=[];pendingDocs=[];state.toast=rec.id;state.warn=null;state.clearForm=true;render();
  setTimeout(function(){state.toast=null;if(!typing())render();},6000);
}

   desk channel with the Warranty and Parts Manager pinged; anything the Warranty and Parts Manager does
   goes as a direct message to the Service Lead who filed the case. The demo shows

}

function lastMsg(c){var m=c.messages||[];return m.length?m[m.length-1]:null;}
function seenAt(id){return Number(localStorage.getItem("wd:seen:"+id)||0);}
function markSeen(id){try{localStorage.setItem("wd:seen:"+id,String(Date.now()));}catch(e){}}
/* a case needs a reply when the last word in the thread came from the hub */
function needsReply(c){var m=lastMsg(c);return !!m&&m.role!=="admin";}
function isUnread(c){var m=(c.messages||[]).filter(function(x){return x.role!=="admin";});if(!m.length)return false;return m[m.length-1].t>seenAt(c.id);}
function inboxView(cfg,all){
  var threads=all.filter(function(c){return (c.messages||[]).length;});
  if(state.q){threads=threads.filter(function(c){var b=(c.id+" "+c.serial+" "+c.submitter+" "+c.hub+" "+c.vendor+" "+(c.messages||[]).map(function(m){return m.text;}).join(" ")).toLowerCase();return b.indexOf(state.q.toLowerCase())>=0;});}
  if(state.inboxFilter==="reply")threads=threads.filter(needsReply);
  if(state.inboxFilter==="unread")threads=threads.filter(isUnread);
  threads.sort(function(a,b){return lastMsg(b).t-lastMsg(a).t;});
  var nReply=all.filter(needsReply).length,nUnread=all.filter(isUnread).length;
  var bar='<div class="wd-inboxbar">'
   +'<button class="'+(state.inboxFilter==="all"?"on":"")+'" onclick="setInboxFilter(\'all\')">All threads</button>'

   +'<button class="'+(state.inboxFilter==="unread"?"on":"")+'" onclick="setInboxFilter(\'unread\')">Unread ('+nUnread+')</button>'
   +'</div>';
  var rows=threads.map(function(c){
    var m=lastMsg(c);var unread=isUnread(c);

  return bar+(rows?'<div class="wd-inbox">'+rows+'</div>':'<div class="wd-empty">'+(state.inboxFilter==="all"?'No message threads yet.':state.inboxFilter==="reply"?'Nothing waiting on you. 🎉':'No unread hub messages.')+'</div>');

/* ---- return label PDFs (attached by the Warranty Manager on an existing case) ---- */
function pickReturnLabel(caseId){
  if(session.role!=="admin")return;
  var inp=el("hiddenDoc");
  inp.onchange=function(){
    var fs=Array.prototype.slice.call(inp.files||[]);
    inp.value="";
    var good=[];
    for(var i=0;i<fs.length;i++){
      if(!isPdf(fs[i])){alert("“"+(fs[i].name||"file")+"” is not a PDF. Export the return label as a PDF and attach that.");}
      else if(fs[i].size>DOC_MAX){alert("“"+(fs[i].name||"file")+"” is "+mb(fs[i].size)+" — over the "+Math.round(DOC_MAX/1048576)+"MB limit.");}
      else good.push(fs[i]);
    }
    if(!good.length)return;
    var btn=el("lbl_up");
    if(btn){btn.disabled=true;btn.textContent="Uploading label…";}
    var metas=[];
    var chain=Promise.resolve();
    good.forEach(function(f,li){
      chain=chain.then(function(){
        return sync.uploadMedia(caseId,"rl"+Date.now()+"-"+li,f,function(ci,total){
          if(btn)btn.textContent="Uploading label "+(li+1)+"/"+good.length+" ("+Math.round(ci/total*100)+"%)…";
        }).then(function(m){metas.push(m);});
      });
    });
    chain.then(function(){
      var c=store.getCases().filter(function(x){return x.id===caseId;})[0];
      if(!c)return;
      c.returnLabels=(c.returnLabels||[]).concat(metas.map(function(m){return Object.assign(m,{by:session.name,t:Date.now()});}));
      c.notes=(c.notes||[]).concat([{t:Date.now(),text:"Return label attached by "+session.name+": "+metas.map(function(m){return m.name;}).join(", ")}]);
      c.messages=(c.messages||[]).concat([{t:Date.now(),from:session.name,role:"admin",text:"Return label attached — open it on this case, print it, and stick it on the box going back to "+c.vendor+"."}]);
      c.modified=Date.now();
      store.saveCase(c);
      notify("label",c);
      render();
    }).catch(function(){
      if(btn){btn.disabled=false;btn.textContent="⚠ Upload failed — tap to retry";}
    });
  };
  inp.click();
}

function toggleEdit(){state.edit=!state.edit;render();}
function saveEdit(id){
  if(session.role!=="admin")return;
  var c=store.getCases().filter(function(x){return x.id===id;})[0];
  if(!c)return;
  var nv=el("e_vendor")?el("e_vendor").value:c.vendor;
  var nc=el("e_category")?el("e_category").value:c.category;
  var ns=el("e_serial")?el("e_serial").value.trim().toUpperCase():c.serial;
  var nk=el("e_sku")?el("e_sku").value.trim():(c.sku||"");
  var nw=el("e_wo")?el("e_wo").value.trim():(c.workorder||"");
  var ncl=el("e_claim")?el("e_claim").value.trim():(c.claim||"");
  var npo=el("e_po")?el("e_po").value.trim():(c.po||"");
  var nf=el("e_asset")?assetIdOk(el("e_asset").value):(c.asset||"");
  if(el("e_asset")&&el("e_asset").value.trim()&&!nf){alert("That doesn’t look like an asset ID. Use letters, digits and dashes, e.g. AST-30418.");return;}
  if(!ns)return;
  var diffs=[];
  if(nv!==c.vendor)diffs.push("OEM "+c.vendor+" → "+nv);
  if(nc!==c.category)diffs.push("category "+c.category+" → "+nc);
  if(ns!==c.serial)diffs.push("serial "+c.serial+" → "+ns);
  if(nk!==(c.sku||""))diffs.push("SKU "+(c.sku||"—")+" → "+(nk||"—"));
  if(nw!==(c.workorder||""))diffs.push("WO "+(c.workorder||"—")+" → "+(nw||"—"));
  if(ncl!==(c.claim||""))diffs.push("OEM claim # "+(c.claim||"—")+" → "+(ncl||"—"));
  if(npo!==(c.po||""))diffs.push("PO # "+(c.po||"—")+" → "+(npo||"—"));
  if(nf!==(c.asset||""))diffs.push("asset ID "+(c.asset||"—")+" → "+(nf||"—"));
  if(diffs.length){
    c.vendor=nv;c.category=nc;c.serial=ns;c.sku=nk;c.workorder=nw;c.claim=ncl;c.po=npo;c.asset=nf;
    c.notes=(c.notes||[]).concat([{t:Date.now(),text:"Details edited by "+session.name+": "+diffs.join(", ")}]);
    c.modified=Date.now();
    store.saveCase(c);
    notify("edit",c,{diffs:diffs});
  }
  state.edit=false;render();
}
/* ---- message attachments (photos + PDFs shared in the thread) ---- */
function pickMsgFiles(){
  if(msgSending)return;
  var inp=el("hiddenMsgFile");
  inp.onchange=function(){
    var fs=Array.prototype.slice.call(inp.files||[]);
    inp.value="";
    fs.forEach(function(f){
      if(isPdf(f)){
        if(f.size>DOC_MAX){alert("“"+(f.name||"file")+"” is "+mb(f.size)+" — over the "+Math.round(DOC_MAX/1048576)+"MB limit for PDFs.");return;}
        pendingMsgFiles.push({kind:"pdf",file:f});
        render();
      }else if((f.type||"").indexOf("image/")===0){
        compress(f,function(d){if(d)pendingMsgFiles.push({kind:"photo",dataUrl:d});render();});
      }else{
        alert("“"+(f.name||"file")+"” isn’t a photo or a PDF. Only photos and PDFs can be shared in the thread.");
      }
    });
  };
  inp.click();
}
function removeMsgFile(i){pendingMsgFiles.splice(i,1);render();}
function sendMsg(id){
  if(msgSending)return;
  var inp=el("d_msg");var t=inp?inp.value.trim():"";
  var files=pendingMsgFiles.slice();
  if(!t&&!files.length)return;
  var c=store.getCases().filter(function(x){return x.id===id;})[0];if(!c)return;
  var finish=function(atts){
    var m={t:Date.now(),from:session.name,role:session.role,text:t};
    if(atts&&atts.length)m.attachments=atts;
    c.messages=(c.messages||[]).concat([m]);
    c.modified=Date.now();
    store.saveCase(c);
    notify("message",c,{text:t,attachments:atts||[]});
    pendingMsgFiles=[];msgSending=false;
    render();
    var n=el("d_msg");if(n)n.value="";
  };
  if(!files.length){finish(files.map(function(a){return a.kind==="photo"?{kind:"photo",url:a.dataUrl}:null;}).filter(Boolean));return;}
  msgSending=true;render();
  var setTxt=function(s){var b=el("d_msgsend");if(b)b.textContent=s;};
  var chain=Promise.resolve([]);
  var stamp=Date.now();
  files.forEach(function(a,i){
    chain=chain.then(function(atts){
      setTxt("Sending "+(i+1)+"/"+files.length+"…");
      if(a.kind==="photo"){
        return sync.uploadPhoto(id,"m"+stamp+"-"+i,a.dataUrl).then(function(url){atts.push({kind:"photo",url:url});return atts;});
      }
      return sync.uploadMedia(id,"m"+stamp+"-"+i,a.file,function(ci,total){
        setTxt("Sending "+(i+1)+"/"+files.length+" ("+Math.round(ci/total*100)+"%)…");
      }).then(function(meta){atts.push({kind:"pdf",base:meta.base,chunks:meta.chunks,name:meta.name,size:meta.size});return atts;});
    });
  });
  chain.then(finish).catch(function(){
    msgSending=false;
    render();
    var n=el("d_msg");if(n)n.value=t;
    alert("Your attachment could not be attached, so the message was not sent. Check your connection and press Send again — it’s still here.");
  });
}

function phImg(label,hue){
  var cv=document.createElement("canvas");cv.width=480;cv.height=360;
  var g=cv.getContext("2d");
  g.fillStyle="hsl("+hue+",26%,88%)";g.fillRect(0,0,480,360);
  g.strokeStyle="hsl("+hue+",32%,40%)";g.lineWidth=7;g.lineCap="round";g.lineJoin="round";
  g.beginPath();g.arc(150,238,54,0,Math.PI*2);g.stroke();
  g.beginPath();g.arc(330,238,54,0,Math.PI*2);g.stroke();
  g.beginPath();g.moveTo(150,238);g.lineTo(212,156);g.lineTo(296,156);g.lineTo(330,238);
  g.moveTo(212,156);g.lineTo(244,238);g.lineTo(296,156);g.moveTo(150,238);g.lineTo(244,238);
  g.moveTo(296,156);g.lineTo(306,128);g.lineTo(330,128);g.moveTo(212,156);g.lineTo(204,136);g.lineTo(226,136);g.stroke();
  g.fillStyle="hsl("+hue+",32%,30%)";g.textAlign="center";
  g.font="600 24px system-ui,sans-serif";g.fillText(label,240,62);
  g.font="14px system-ui,sans-serif";g.fillText("demo placeholder photo",240,90);
  return cv.toDataURL("image/jpeg",0.72);
}
function demoPdf(title,lines){
  var st="BT /F1 18 Tf 60 740 Td ("+title+") Tj ET\n";
  for(var i=0;i<lines.length;i++)st+="BT /F1 11 Tf 60 "+(708-i*18)+" Td ("+lines[i]+") Tj ET\n";
  var objs=["<< /Type /Catalog /Pages 2 0 R >>","<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>",
    "<< /Length "+st.length+" >>\nstream\n"+st+"endstream","<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"];
  var out="%PDF-1.4\n",offs=[];
  objs.forEach(function(o,i){offs.push(out.length);out+=(i+1)+" 0 obj\n"+o+"\nendobj\n";});
  var x=out.length;out+="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n";
  offs.forEach(function(o){out+=("0000000000"+o).slice(-10)+" 00000 n \n";});
  out+="trailer\n<< /Size "+(objs.length+1)+" /Root 1 0 R >>\nstartxref\n"+x+"\n%%EOF";
  return new Blob([out],{type:"application/pdf"});
}
